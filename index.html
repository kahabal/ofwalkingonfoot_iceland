<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>A field diary for "Iceland: A Loud Solitude" (2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ── ROOT ── */
:root {
  --paper: #f2ede3;
  --paper2: #ede8dc;
  --ink: #2a2118;
  --muted: #8a7a68;
  --border: #c8b99a;
  --accent: #2d5a8e;
  --red: #8e3a2d;
  --green: #3a6e4a;
  --font-serif: 'Cormorant Garamond', serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-read: 'Source Serif 4', serif;
  --font-emoji: 'Noto Color Emoji', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-serif);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 1000;
}

/* ── HEADER ── */
#site-header {
  border-bottom: 2px solid var(--ink);
  padding: 10px 28px 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
#title-block {
  padding-bottom: 10px;
}
#title-block .author-name {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 4px;
}
#title-block h1 {
  font-size: clamp(22px, 3.5vw, 34px);
  font-weight: 300;
  font-style: italic;
  line-height: 1.1;
}

/* ── TABS ── */
#tabs {
  display: flex;
  gap: 0;
  align-self: flex-end;
}
.tab-btn {
  padding: 10px 26px;
  border: 1px solid var(--border);
  border-bottom: none;
  background: var(--paper2);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 4px 4px 0 0;
  margin-right: 4px;
  transition: all .15s;
}
.tab-btn:hover { background: var(--paper); color: var(--ink); }
.tab-btn.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--ink);
  border-bottom: 2px solid var(--paper);
  margin-bottom: -2px;
  z-index: 2;
}
.tab-btn .tab-icon { font-size: 14px; margin-right: 7px; }

/* ── VIEWS ── */
#view-diary, #view-tracker { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
#view-diary.active, #view-tracker.active { display: flex; }

/* ── DIARY VIEW ── */
#diary-status {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  padding: 5px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#diary-legend {
  display: flex; flex-wrap: wrap; gap: 5px 16px;
  padding: 7px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.dli { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.dlic { font-family: var(--font-emoji); font-size: 14px; line-height: 1; }
#diary-canvas-wrap {
  flex: 1; overflow: hidden; position: relative; cursor: grab;
}
#diary-canvas-wrap.pan { cursor: grabbing; }
#dial { display: block; position: absolute; top: 0; left: 0; }
#diary-zoom-bar {
  position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; align-items: center; z-index: 10;
}
.dzbt { width: 28px; height: 28px; background: var(--paper); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; font-size: 16px; color: var(--muted); display: flex; align-items: center; justify-content: center; font-family: monospace; }
.dzbt:hover { background: var(--border); }
.dzrst { width: 42px; font-size: 11px; font-family: var(--font-mono); height: 24px; }
.dzhint { font-family: var(--font-mono); font-size: 11px; color: var(--muted); opacity: .65; }
#dtip { display: none; position: absolute; z-index: 50; background: #2a2118; color: #f2ede3; font-family: var(--font-mono); font-size: 12px; padding: 5px 10px; border-radius: 3px; pointer-events: none; max-width: 240px; }
#dnp { display: none; position: absolute; z-index: 50; background: #f8f3e8; border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; max-width: 230px; font-family: var(--font-read); font-size: 16px; line-height: 1.5; color: var(--ink); pointer-events: none; }
#dnpd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-style: normal; display: block; margin-bottom: 4px; letter-spacing: .07em; text-transform: uppercase; }
#dnp.show { display: block; }
#diary-status { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 5px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

/* ── TRACKER VIEW ── */
#tracker-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 24px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; flex-wrap: wrap; gap: 8px;
}
#live-status { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; animation: blink 2s infinite; }
.live-dot.ok { background: var(--green); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
#btn-refresh { background: none; border: 1px solid var(--border); color: var(--muted); font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border-radius: 3px; cursor: pointer; }
#btn-refresh:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#stats-bar { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.stat-cell { flex: 1; min-width: 80px; padding: 8px 16px; border-right: 1px solid var(--border); text-align: center; }
.stat-cell:last-child { border-right: none; }
.stat-num { font-size: 22px; font-weight: 300; color: var(--accent); display: block; line-height: 1; }
.stat-label { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 3px; display: block; }
#tracker-layout { display: grid; grid-template-columns: 1fr 380px; flex: 1; overflow: hidden; min-height: 0; }
@media (max-width: 900px) { #tracker-layout { grid-template-columns: 1fr; } }
#map-col { position: relative; border-right: 1px solid var(--border); overflow: hidden; }
#map { width: 100%; height: 100%; }
.leaflet-container { font-family: var(--font-serif); background: #e8e4d8; }
.leaflet-popup-content-wrapper { background: var(--paper); border: 1px solid var(--border); border-radius: 4px; box-shadow: 4px 4px 0 rgba(0,0,0,.1); font-family: var(--font-serif); }
.leaflet-popup-tip { background: var(--paper); }
.leaflet-popup-content { margin: 10px 14px; min-width: 180px; }
.popup-time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.popup-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.popup-row { font-family: var(--font-read); font-size: 14px; color: var(--muted); }
.popup-row span { color: var(--ink); font-weight: 500; }
.popup-note { font-family: var(--font-read); font-size: 15px; line-height: 1.5; color: var(--ink); margin-top: 6px; }
.detail-note { font-family: var(--font-read); font-size: 16px; line-height: 1.6; color: var(--ink); }
.day-marker { width: 26px; height: 26px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 9px; font-weight: 500; color: white; box-shadow: 0 2px 5px rgba(0,0,0,.3); }
.leaflet-control-layers { font-family: var(--font-mono); font-size: 12px; color: var(--ink); background: var(--paper); border: 1px solid var(--border) !important; border-radius: 4px; box-shadow: none !important; }
.leaflet-control-layers-expanded { padding: 4px 10px; }
.leaflet-control-layers label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.leaflet-control-layers input { accent-color: #8e3a2d; }
.photo-marker img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); object-fit: cover; display: block; cursor: pointer; }
#lightbox { display: none; position: fixed; inset: 0; z-index: 1200; background: rgba(26,22,18,.94); flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 100%; max-height: calc(100% - 70px); object-fit: contain; }
#lightbox .lb-cap { margin-top: 10px; text-align: center; color: #f2ede3; }
#lightbox .lb-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: #c8b99a; }
#lightbox .lb-text { font-family: var(--font-read); font-size: 15px; margin-top: 2px; }
#lightbox .lb-close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: #f2ede3; font-size: 26px; cursor: pointer; }
/* On computers the photo opens as a framed view, not full screen; phones keep the full-screen view */
@media (min-width: 701px) {
  #lightbox { background: rgba(26,22,18,.6); }
  #lightbox img { max-width: min(900px, 80vw); max-height: 75vh; border: 6px solid var(--paper); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
}
.travel-icon { font-family: var(--font-emoji); font-size: 19px; line-height: 28px; text-align: center; background: var(--paper); border: 1px solid var(--border); border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.latest-marker { width: 12px; height: 12px; border-radius: 50%; background: var(--red); border: 2px solid white; box-shadow: 0 0 0 3px rgba(142,58,45,.3); animation: ping 2s infinite; }
@keyframes ping { 0%,100%{box-shadow:0 0 0 3px rgba(142,58,45,.3)} 50%{box-shadow:0 0 0 8px rgba(142,58,45,.08)} }
#log-col { overflow-y: scroll; height: 100%; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
#log-col::-webkit-scrollbar { width: 6px; }
#log-col::-webkit-scrollbar-track { background: transparent; }
#log-col::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
#log-col::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.day-group { border-bottom: 2px solid var(--border); }
.day-heading { padding: 13px 18px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; background: var(--paper2); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
.day-heading:hover { background: #e5e0d2; }
.day-name { font-size: 19px; font-weight: 300; font-style: italic; }
.day-date { font-family: var(--font-read); font-size: 14px; color: #6b5d4d; margin-top: 2px; }
.day-meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; line-height: 1.6; }
.day-count { background: var(--accent); color: white; font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 8px; }
.day-entries { display: block; }
.day-entries.collapsed { display: none; }
.entry { padding: 12px 18px; border-bottom: 1px solid #ddd8cc; cursor: pointer; transition: background .15s; }
.entry:hover { background: #ede8dc; }
.entry-time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.entry-weather { font-size: 14px; margin-bottom: 6px; }
.entry-fields { display: flex; flex-wrap: wrap; gap: 5px; }
.field-tag { font-family: var(--font-mono); font-size: 12px; padding: 3px 7px; border-radius: 3px; border: 1px solid var(--border); color: var(--muted); }
.field-tag.has-val { border-color: var(--accent); color: var(--accent); }
.field-tag.pain-tag { border-color: var(--red); color: var(--red); }
.entry-note { font-family: var(--font-read); font-size: 16px; color: var(--ink); margin-top: 6px; border-left: 2px solid var(--border); padding-left: 8px; line-height: 1.6; }
.entry-gps { font-family: var(--font-mono); font-size: 11px; color: #aaa; margin-top: 5px; }
.comparison-block { margin-top: 8px; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; font-family: var(--font-read); font-size: 14px; }
.comparison-row { display: grid; grid-template-columns: 112px 1fr; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.comparison-row:last-child { border-bottom: none; }
.comparison-row.forecasted { background: rgba(45,90,142,.04); }
.comparison-row.perceived  { background: rgba(122,79,45,.04); }
.comp-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.comp-val { font-weight: 500; font-size: 14px; }
#detail-modal { display: none; position: fixed; inset: 0; background: rgba(26,22,18,.7); z-index: 1100; align-items: center; justify-content: center; padding: 20px; }
#detail-modal.open { display: flex; }
#detail-box { background: var(--paper); border: 1px solid var(--border); border-radius: 4px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 6px 6px 0 rgba(0,0,0,.12); }
#detail-header { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
#detail-title { font-size: 18px; font-weight: 300; font-style: italic; }
#detail-sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
#detail-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--muted); }
#detail-body { padding: 14px 18px 18px; }
.detail-section { margin-bottom: 14px; }
.detail-section h3 { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 16px; }
.detail-row { display: flex; justify-content: space-between; font-family: var(--font-read); font-size: 14px; padding: 2px 0; border-bottom: 1px dotted #ddd; }
.d-label { color: var(--muted); } .d-val { font-weight: 500; }
.detail-comparison { border: 1px solid var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.detail-comp-row { display: grid; grid-template-columns: 112px 1fr; padding: 6px 10px; border-bottom: 1px solid var(--border); font-family: var(--font-read); font-size: 14px; }
.detail-comp-row:last-child { border-bottom: none; }
.detail-comp-row.forecasted { background: rgba(45,90,142,.04); }
.detail-comp-row.perceived  { background: rgba(122,79,45,.04); }
.dc-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); align-self: center; }
.scale-icons { display: flex; gap: 2px; align-items: center; }
.scale-icon { font-size: 12px; opacity: 0.15; }
.scale-icon.on { opacity: 1; }
#foot { text-align: center; padding: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--border); border-top: 1px solid var(--border); }
#loading-screen { position: fixed; inset: 0; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 900; transition: opacity .5s; }
#loading-screen.gone { opacity: 0; pointer-events: none; }
.loading-title { font-size: 24px; font-weight: 300; font-style: italic; }
.loading-sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.loading-bar { width: 140px; height: 1px; background: var(--border); overflow: hidden; }
.loading-fill { width: 60%; height: 100%; background: var(--ink); animation: lslide 1.4s ease-in-out infinite; }
@keyframes lslide { 0%{transform:translateX(-100%)} 100%{transform:translateX(260%)} }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ── PHONE ── */
@supports (height: 100dvh) { body { height: 100dvh; } }
@media (max-width: 700px) {
  #site-header { padding: 8px 16px 0; gap: 6px; }
  #title-block { padding-bottom: 4px; }
  #title-block h1 { font-size: 22px; }
  #tabs { width: 100%; }
  .tab-btn { flex: 1; padding: 8px 10px; margin-right: 4px; }
  .tab-btn:last-child { margin-right: 0; }
  #tracker-topbar { padding: 6px 16px; }
  .stat-cell { padding: 6px 10px; }
  .stat-num { font-size: 20px; }
  #tracker-layout { grid-template-rows: 33vh 1fr; }
  #map-col { border-right: none; border-bottom: 1px solid var(--border); }
  .day-heading { padding: 12px 16px 10px; flex-wrap: wrap; }
  .entry { padding: 12px 16px; }
  #detail-modal { padding: 10px; }
  #detail-box { max-height: 92vh; }
  .detail-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-title">Of Walking on Foot</div>
  <div class="loading-sub">Iceland · 2025</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-sub" id="loading-msg">Composing the field diary…</div>
</div>

<!-- SHARED HEADER -->
<div id="site-header">
  <div id="title-block">
    <span class="author-name">Of Walking on Foot - Dario J Laganà (2026)</span>
    <h1>A field diary for "Iceland: A Loud Solitude"</h1>
  </div>
  <div id="tabs">
    <button class="tab-btn active" id="tab-diary" onclick="switchTab('diary')">
      <span class="tab-icon">◉</span>Radial Diary
    </button>
    <button class="tab-btn" id="tab-tracker" onclick="switchTab('tracker')">
      <span class="tab-icon">🗺</span>Map Tracker
    </button>
  </div>
</div>

<!-- DIARY VIEW -->
<div id="view-diary" class="active">
  <div id="diary-status" hidden>Loading…</div>
  <div id="diary-legend"></div>
  <div id="diary-canvas-wrap">
    <canvas id="dial"></canvas>
    <div id="diary-zoom-bar">
      <button class="dzbt" onclick="dZoomBy(1.2)">+</button>
      <button class="dzbt" onclick="dZoomBy(0.85)">−</button>
      <button class="dzbt dzrst" onclick="dResetZoom()">reset</button>
      <span class="dzhint">scroll · zoom</span>
    </div>
    <div id="dtip"></div>
    <div id="dnp"><span id="dnpd"></span><span id="dnpt"></span></div>
  </div>
</div>

<!-- TRACKER VIEW -->
<div id="view-tracker">
  <div id="tracker-topbar">
    <div id="live-status">
      <div class="live-dot" id="live-dot"></div>
      <span id="live-label">Connecting…</span>
      <span id="last-update"></span>
    </div>
    <button id="btn-refresh" onclick="loadData()">↻ Refresh</button>
  </div>
  <div id="stats-bar">
    <div class="stat-cell"><span class="stat-num" id="stat-days">—</span><span class="stat-label">Days on foot</span></div>
    <div class="stat-cell"><span class="stat-num" id="stat-last-loc" style="font-size:12px;cursor:pointer"></span><span class="stat-label">Last location</span></div>
  </div>
  <div id="tracker-layout">
    <div id="map-col"><div id="map"></div></div>
    <div id="log-col">
      <div id="log-list"></div>
      <div id="foot">Of Walking on Foot · Iceland · Updates daily at midnight</div>
    </div>
  </div>
</div>

<!-- PHOTO LIGHTBOX (map) -->
<div id="lightbox" onclick="if(event.target.id==='lightbox'||event.target.classList.contains('lb-close'))closeLightbox()">
  <button class="lb-close" aria-label="Close">✕</button>
  <img alt="">
  <div class="lb-cap"><div class="lb-meta"></div><div class="lb-text"></div></div>
</div>

<!-- DETAIL MODAL (tracker) -->
<div id="detail-modal" onclick="closeDetail(event)">
  <div id="detail-box">
    <div id="detail-header">
      <div><div id="detail-title">—</div><div id="detail-sub">—</div></div>
      <button id="detail-close" onclick="closeModal()">✕</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<script>
// ── TAB SWITCHER ────────────────────────────────────────
let diaryActive = true;
let trackerInited = false;
let diaryInited = false;

function switchTab(tab) {
  diaryActive = tab === 'diary';
  document.getElementById('view-diary').classList.toggle('active', diaryActive);
  document.getElementById('view-tracker').classList.toggle('active', !diaryActive);
  document.getElementById('tab-diary').classList.toggle('active', diaryActive);
  document.getElementById('tab-tracker').classList.toggle('active', !diaryActive);

  if (diaryActive && !diaryInited) {
    diaryInited = true;
    diaryInit();
  }
  if (!diaryActive && !trackerInited) {
    trackerInited = true;
    trackerInit();
  }
  // Invalidate map size when switching to tracker
  if (!diaryActive && typeof map !== 'undefined' && map) {
    setTimeout(() => map.invalidateSize(), 50);
  }
}

// Open tracker tab and center map on a lat/lon, optionally showing a note popup
function openInTracker(lat, lon, note, dayNum, date) {
  switchTab('tracker');
  if (typeof map === 'undefined' || !map) return;
  const doIt = () => {
    map.invalidateSize();
    if (lat && lon) {
      map.setView([lat, lon], 13);
      // Open a popup at the location
      const content = `
        <div class="popup-time">Day ${dayNum} · ${date || ''}</div>
        ${note ? `<div class="popup-note">"${note}"</div>` : ''}
        <div style="margin-top:6px"><a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color:var(--accent);font-size:11px">Open in Google Maps →</a></div>
      `;
      L.popup({ closeButton: true, maxWidth: 280 })
        .setLatLng([lat, lon])
        .setContent(content)
        .openOn(map);
    }
  };
  // If tracker just initialised, wait for it
  setTimeout(doIt, trackerInited ? 80 : 800);
}

// ─────────────────────────────────────────────
// DATA UTILS
// ─────────────────────────────────────────────
function d_toFloat(v){ return parseFloat(String(v||'').replace(',','.')); }

// Shared by both views. Quoted fields may contain separators, line breaks (multi-line
// notes) and "" for a literal quote, so rows can't be found by splitting on newlines.
function d_parseCSV(text) {
  text = text.trim();
  // Auto-detect separator from the header line: semicolon or comma
  const firstLine = text.slice(0, text.search(/\r?\n|$/));
  const sep = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = d_csvRows(text, sep);
  if (rows.length < 2) return [];
  const headers = rows[0];
  return rows.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h,i) => obj[h.trim()] = (vals[i]||'').trim());
    return obj;
  }).filter(e => e.Timestamp || e.Date);
}

function d_csvRows(text, sep=',') {
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){
        if(text[i+1]==='"'){cur+='"';i++;}
        else inQ=false;
      } else if(ch!=='\r') cur+=ch;
      continue;
    }
    if(ch==='"'){inQ=true;continue;}
    if(ch===sep){row.push(cur);cur='';continue;}
    if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';continue;}
    if(ch==='\r') continue;
    cur+=ch;
  }
  row.push(cur);
  rows.push(row);
  return rows;
}

function groupByDay(entries) {
  const byDay={};
  entries.forEach(e=>{
    // Handle both DD/MM/YYYY and ISO YYYY-MM-DD date formats
    let day = e.Date || (e.Timestamp||'').split('T')[0] || 'Unknown';
    if(!byDay[day]) byDay[day]=[];
    byDay[day].push(e);
  });
  // Sort by parsing the actual date, handling DD/MM/YYYY format
  const parseDate = s => {
    const p = s.split('/');
    if(p.length===3) return new Date(p[2], p[1]-1, p[0]); // DD/MM/YYYY
    return new Date(s); // ISO or other
  };
  return Object.keys(byDay)
    .sort((a,b) => parseDate(a) - parseDate(b))
    .map((d,i) => ({date:d, dayNum:i+1, entries:byDay[d]}));
}

// Returns numeric value 0-5, or null if not recorded
function dayValue(day, ring) {
  const ee = day.entries;
  if (ring.type === 'scale') {
    const vals = ee.map(e=>parseFloat(e[ring.key])).filter(v=>!isNaN(v)&&v>0);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }
  if (ring.type === 'iconscale') {
    const vals = ee.map(e=>parseFloat(e[ring.key])).filter(v=>!isNaN(v)&&v>0);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }
  if (ring.type === 'pace') {
    const vals = ee.map(e=>PACE_SCALE[e[ring.key]]).filter(Boolean);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }
  if (ring.type === 'wxicon') {
    if(SPECIAL_WEATHER[day.date]) return SPECIAL_WEATHER[day.date].icon;
    // Return the weather icon string directly, not a number
    for(const e of ee) {
      const w = e['Weather'] || e['Weather_Auto'] || '';
      if(!w) continue;
      const wl = w.toLowerCase();
      for(const[k,icon] of Object.entries(WEATHER_ICONS)) {
        if(wl.includes(k)) return icon; // return icon string
      }
    }
    return null;
  }
  if (ring.type === 'terrain') {
    // Return the FIRST/primary terrain icon only — unique per day
    for(const e of ee) {
      const t = e['Terrain'] || '';
      if(!t.trim()) continue;
      const parts = t.split(/[;,]/);
      for(const p of parts) {
        const pl = p.trim().toLowerCase();
        for(const[k,icon] of Object.entries(TERRAIN_ICONS)) {
          if(pl.includes(k)) return icon; // single icon, first match
        }
      }
      return '🗺️'; // fallback
    }
    return null;
  }
  if (ring.type === 'state') {
    // Trance + Mental Loop + Pain — returns bitmask
    const hasTrance = ee.some(e=>e['Trance']&&e['Trance'].toLowerCase()==='yes');
    const hasLoop   = ee.some(e=>e['Mental_Loop']&&e['Mental_Loop'].toLowerCase()==='yes');
    const hasPain   = ee.some(e=>e['Pain']&&e['Pain'].trim()&&e['Pain'].toLowerCase()!=='no');
    if(!hasTrance && !hasLoop && !hasPain) return null;
    return { trance:hasTrance, loop:hasLoop, pain:hasPain };
  }
  if (ring.type === 'encounters') {
    // Returns { humans, animals }
    const hasHumans = ee.some(e=>e['Humans']&&e['Humans'].toLowerCase()==='yes');
    const animStr   = dayAnimals(day);
    if(hasHumans || animStr) return { humans: hasHumans, animStr };
    return null;
  }
  if (ring.type === 'bool') {
    const has = ee.some(e=>e[ring.key]&&e[ring.key].trim()&&e[ring.key].toLowerCase()!=='no');
    return has ? 1 : null;
  }
  if (ring.type === 'note') {
    return ee.some(e=>e.Note&&e.Note.trim()) ? 1 : null;
  }
  if (ring.type === 'gps') {
    return dayFirstGPS(day) ? 1 : null;
  }
  return null;
}

function dayNote(day) {
  for(const e of day.entries) if(e.Note&&e.Note.trim()) return e.Note.trim();
  return null;
}

function dayFirstGPS(day) {
  for(const e of day.entries){
    const lat=d_toFloat(e.Latitude), lon=d_toFloat(e.Longitude);
    if(!isNaN(lat)&&!isNaN(lon)&&lat!==0) return [lat,lon];
  }
  return null;
}

// Every encounter of the day, from all its entries, each name once (first spelling wins)
function dayAnimals(day) {
  const seen = new Map();
  for(const e of day.entries){
    for(const a of (e.Animals || '').split(/[;,]/)){
      const name = a.trim();
      if(name && !seen.has(name.toLowerCase())) seen.set(name.toLowerCase(), name);
    }
  }
  return seen.size ? [...seen.values()].join('; ') : null;
}

// The words behind the weather and terrain icons, for tooltips (same matching as dayValue)
function dayWeatherText(day) {
  let text = null;
  for(const e of day.entries) {
    const w = e['Weather'] || e['Weather_Auto'] || '';
    if(!w) continue;
    const wl = w.toLowerCase();
    if(Object.keys(WEATHER_ICONS).some(k => wl.includes(k))) { text = w.trim(); break; }
  }
  const special = SPECIAL_WEATHER[day.date];
  if(special) return text ? `${special.text}, ${text}` : special.text;
  return text;
}

function dayTerrainText(day) {
  for(const e of day.entries) {
    const t = e['Terrain'] || '';
    if(!t.trim()) continue;
    for(const p of t.split(/[;,]/)) {
      const pl = p.trim().toLowerCase();
      if(Object.keys(TERRAIN_ICONS).some(k => pl.includes(k))) return p.trim();
    }
    return t.trim();
  }
  return null;
}

function animalIcons(str) {
  if(!str) return '';
  return str.split(/[;,]/).map(a=>{
    const k=a.trim().toLowerCase();
    return D_ANIMAL_ICONS[k]||a.trim();
  }).join(' ');
}

// Radial icons use one emoji font on every device, instead of each system's own set
const EMOJI_FONT = "'Noto Color Emoji', serif";

function hexToRgba(hex, alpha) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Render a single emoji/text icon centered at (x,y) with given size
// Draws a subtle background circle so icons are visible on any background
function drawIcon(ctx, icon, x, y, size, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  // Small background circle for contrast
  ctx.beginPath();
  ctx.arc(x, y, size * 0.62, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(242, 237, 227, 0.7)';
  ctx.fill();
  ctx.font = `${size}px ${EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(icon, x, y);
  drawnIcons.add(icon);
  ctx.restore();
}

function draw(days) {
  const canvas = document.getElementById('dial');
  // Make canvas larger than viewport — circle can overflow
  const size = Math.max(window.innerWidth, window.innerHeight) * 1.1;
  dialRes = Math.min((window.devicePixelRatio || 1) * 2, 4096 / size);
  canvas.width = Math.round(size * dialRes); canvas.height = Math.round(size * dialRes);
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dialRes, 0, 0, dialRes, 0, 0);
  const cx = size/2, cy = size/2;
  const N = days.length;

  noteHitAreas = [];
  gpsHitAreas  = [];
  dayLabelHitAreas = [];
  latestGPSPos = null;

  ctx.clearRect(0,0,size,size);
  ctx.fillStyle='#f2ede3';
  ctx.fillRect(0,0,size,size);

  if(N===0){ return; }

  // Layout — large circle, bigger center void, rings spread wide
  const innerR = size * 0.14;
  const outerR = size * 0.46;
  const ringCount = RINGS.length;
  const ringW = (outerR - innerR) / ringCount;

  // Angle helpers — counterclockwise from SW (225°)
  // counterclockwise: angle decreases as day index increases
  const totalAngle = Math.PI * 2;
  const wedgeA = totalAngle / N;

  function wedgeAngles(dayIdx) {
    // counterclockwise: start at SW, go left (decreasing angle)
    const start = START_ANGLE - dayIdx * wedgeA;
    const end   = START_ANGLE - (dayIdx+1) * wedgeA;
    return { start, end, mid: (start+end)/2 };
  }

  // Concentric guides
  for(let r=0;r<=ringCount;r++){
    ctx.beginPath();
    ctx.arc(cx,cy,innerR+r*ringW,0,Math.PI*2);
    ctx.strokeStyle='rgba(180,155,120,0.15)';
    ctx.lineWidth=0.5;
    ctx.stroke();
  }

  // Radial dividers — visible lines between each day wedge
  for(let d=0;d<N;d++){
    const {start} = wedgeAngles(d);
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(start)*innerR, cy+Math.sin(start)*innerR);
    ctx.lineTo(cx+Math.cos(start)*outerR, cy+Math.sin(start)*outerR);
    ctx.strokeStyle='rgba(160,140,110,0.45)';
    ctx.lineWidth=0.8;
    ctx.stroke();
  }

  // DATA
  days.forEach((day, dayIdx) => {
    const {start, end, mid} = wedgeAngles(dayIdx);
    const gapA = Math.min(0.018, wedgeA * 0.08);
    const drawStart = start - gapA;
    const drawEnd   = end   + gapA;
    const isLatest  = dayIdx === N-1;

    RINGS.forEach((ring, ringIdx) => {
      const rInner = innerR + ringIdx * ringW;
      const rOuter = innerR + (ringIdx+1) * ringW;
      const rMid   = (rInner + rOuter) / 2;
      const val    = dayValue(day, ring);

      // GPS ring gets a subtle background; all others transparent
      if(ring.type === 'gps' && val !== null) {
        ctx.beginPath();
        ctx.arc(cx,cy,rOuter-0.5, drawEnd, drawStart);
        ctx.arc(cx,cy,rInner+0.5, drawStart, drawEnd, true);
        ctx.closePath();
        ctx.fillStyle = hexToRgba(ring.color, 0.12);
        ctx.fill();
      }

      // Faint arc border on rings that have data
      if(val !== null) {
        ctx.beginPath();
        ctx.arc(cx,cy,rOuter-1,drawEnd,drawStart);
        ctx.strokeStyle=hexToRgba(ring.color, ring.type==='gps' ? 0.50 : 0.30);
        ctx.lineWidth=0.4;
        ctx.stroke();
      }

      if(val === null) return; // no data — skip icons

      // ── ICON RENDERING ──
      const iconSize = Math.max(14, Math.min(ringW * 0.80, 26));
      const spread   = Math.abs(drawStart - drawEnd) * 0.72;

      if(ring.type === 'note') {
        const nx = cx + Math.cos(mid)*rMid;
        const ny = cy + Math.sin(mid)*rMid;
        const btnR = Math.max(3, ringW*0.28);
        ctx.beginPath();
        ctx.arc(nx,ny,btnR,0,Math.PI*2);
        ctx.fillStyle = hexToRgba(ring.color, 1.0);
        ctx.fill();
        const note = dayNote(day);
        const gps = dayFirstGPS(day);
        if(note) noteHitAreas.push({x:nx, y:ny, r:btnR+5, dayNum:day.dayNum, note, date:day.date, lat:gps?gps[0]:null, lon:gps?gps[1]:null});
        ctx.save();
        ctx.font=`${Math.max(5,ringW*0.3)}px ${EMOJI_FONT}`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=1.0; ctx.fillStyle='#f2ede3';
        ctx.fillText('✎',nx,ny+0.5);
        ctx.restore();

      } else if(ring.type === 'gps') {
        const px = cx + Math.cos(mid)*rMid;
        const py = cy + Math.sin(mid)*rMid;
        const gps = dayFirstGPS(day);
        const hitR = Math.max(10, iconSize * 0.8);
        if(isLatest) {
          latestGPSPos = {x:px, y:py, gps};
          if(gps) gpsHitAreas.push({x:px, y:py, r:hitR+4, dayNum:day.dayNum, lat:gps[0], lon:gps[1]});
        } else {
          drawIcon(ctx, '📍', px, py, iconSize*1.2, 1);
          if(gps) gpsHitAreas.push({x:px, y:py, r:hitR, dayNum:day.dayNum, lat:gps[0], lon:gps[1]});
        }

      } else if(ring.type === 'wxicon') {
        // Single weather condition icon
        const wx = cx + Math.cos(mid)*rMid;
        const wy = cy + Math.sin(mid)*rMid;
        drawIcon(ctx, val, wx, wy, iconSize*1.1, 1);

      } else if(ring.type === 'terrain') {
        // Single icon — primary terrain type for this day
        const ix = cx + Math.cos(mid)*rMid;
        const iy = cy + Math.sin(mid)*rMid;
        // Road (asphalt, gravel) is the most common terrain: draw it smaller so it doesn't dominate the ring
        const tIcon = typeof val === 'string' ? val : '🗺️';
        drawIcon(ctx, tIcon, ix, iy, iconSize * (tIcon === '🛣️' ? 0.8 : 1.1), 1);

      } else if(ring.type === 'state') {
        // Trance 🌀 + Mental Loop 🔁 + Pain ⚡ — show up to 3 icons
        const { trance, loop, pain } = val;
        const stateIcons = [];
        if(trance) stateIcons.push('👁️');
        if(loop)   stateIcons.push('🌀');
        if(pain)   stateIcons.push('⚡');
        const count = stateIcons.length;
        if(count === 1) {
          drawIcon(ctx, stateIcons[0], cx+Math.cos(mid)*rMid, cy+Math.sin(mid)*rMid, iconSize, 1);
        } else {
          const off = spread * 0.28;
          stateIcons.forEach((ic, k) => {
            const a = mid - off*(count-1)/2 + k*off;
            drawIcon(ctx, ic, cx+Math.cos(a)*rMid, cy+Math.sin(a)*rMid, iconSize*0.85, 1);
          });
        }

      } else if(ring.type === 'encounters') {
        // val = { humans, animStr }
        const { humans, animStr } = val;
        const allIcons = [];
        if(humans) allIcons.push('👥');
        if(animStr) {
          animStr.split(/[;,]/).forEach(a => {
            const k = a.trim().toLowerCase();
            allIcons.push(D_ANIMAL_ICONS[k] || '🐾');
          });
        }
        const count = allIcons.length;
        if(count === 1) {
          drawIcon(ctx, allIcons[0], cx+Math.cos(mid)*rMid, cy+Math.sin(mid)*rMid, iconSize, 1);
        } else {
          const arcS = Math.min(spread, Math.abs(drawStart-drawEnd)*0.85);
          allIcons.forEach((ic,k) => {
            const t = count===1 ? 0.5 : k/(count-1);
            const angle = mid - arcS*0.5 + t*arcS;
            const rOff = rMid + (ringW*0.12)*(k%2===0?1:-1);
            // Busy days get smaller icons so they overlap less inside the narrow slice
            const sz = count > 4 ? iconSize*0.6 : count > 3 ? iconSize*0.75 : iconSize*0.90;
            drawIcon(ctx, ic, cx+Math.cos(angle)*rOff, cy+Math.sin(angle)*rOff, sz, 1);
          });
        }

      } else if(ring.type==='bool') {
        drawIcon(ctx, ring.icon, cx+Math.cos(mid)*rMid, cy+Math.sin(mid)*rMid, iconSize*0.95, 1);

      } else if(ring.type === 'iconscale') {
        const n = Math.max(1, Math.min(5, Math.round(val)));
        const ix = cx + Math.cos(mid)*rMid;
        const iy = cy + Math.sin(mid)*rMid;

        if(ring.key === 'Solitude') {
          // Same icon every day, level written next to it (like the trolley weight)
          drawIcon(ctx, '🧘', ix, iy, iconSize, 1);
          ctx.save();
          ctx.globalAlpha = 1.0;
          ctx.font = `bold ${Math.max(7, ringW*0.32)}px 'JetBrains Mono', monospace`;
          ctx.fillStyle = ring.color;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(n, ix + iconSize*0.55, iy + iconSize*0.1);
          ctx.restore();

        } else if(ring.key === 'Trolley') {
          drawIcon(ctx, '🏋️', ix, iy, iconSize, 1);
          ctx.save();
          ctx.globalAlpha = 1.0;
          ctx.font = `bold ${Math.max(7, ringW*0.32)}px 'JetBrains Mono', monospace`;
          ctx.fillStyle = '#c4a068';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(n, ix + iconSize*0.55, iy + iconSize*0.1);
          ctx.restore();

        } else {
          const levelMap = LEVEL_ICONS[ring.key];
          const icon = levelMap ? levelMap[n-1] : ring.icon;
          drawIcon(ctx, icon, ix, iy, iconSize*1.05, 1);
        }

      } else {
        // pace — use level icons
        const n = Math.max(1, Math.min(5, Math.round(val)));
        const icon = LEVEL_ICONS['Pace'] ? LEVEL_ICONS['Pace'][n-1] : ring.icon;
        drawIcon(ctx, icon, cx+Math.cos(mid)*rMid, cy+Math.sin(mid)*rMid, iconSize, 1);
      }
    });

    // Day label — every day, outside the outer ring
    {
      const labelR = outerR + ringW * 0.9;
      const lx = cx + Math.cos(mid)*labelR;
      const ly = cy + Math.sin(mid)*labelR;
      const isMajor = (dayIdx+1) % 5 === 0 || dayIdx === 0;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(mid + Math.PI/2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if(isMajor) {
        ctx.font = `bold ${Math.max(10, size*0.013)}px 'JetBrains Mono', monospace`;
        ctx.fillStyle = 'rgba(70,50,30,0.92)';
      } else {
        ctx.font = `${Math.max(7, size*0.009)}px 'JetBrains Mono', monospace`;
        ctx.fillStyle = 'rgba(120,100,75,0.50)';
      }
      ctx.fillText(String(dayIdx+1), 0, 0);
      ctx.restore();
      dayLabelHitAreas.push({x:lx, y:ly, r:ringW*0.5, dayNum:day.dayNum, date:day.date});
    }
  });

  // Center — empty, same background color
  ctx.beginPath();
  ctx.arc(cx,cy,innerR,0,Math.PI*2);
  ctx.fillStyle='#f2ede3';
  ctx.fill();

  // Outer ring border
  ctx.beginPath();
  ctx.arc(cx,cy,outerR+ringW*0.6,0,Math.PI*2);
  ctx.strokeStyle='rgba(180,150,110,0.18)'; ctx.lineWidth=0.5; ctx.stroke();

  // Reykjavík start marker at SW
  const swX = cx + Math.cos(START_ANGLE)*(outerR + ringW*1.4);
  const swY = cy + Math.sin(START_ANGLE)*(outerR + ringW*1.4);
  ctx.save();
  ctx.translate(swX, swY);
  ctx.rotate(START_ANGLE + Math.PI/2);
  ctx.fillStyle='rgba(138,122,104,0.7)';
  ctx.font=`${Math.max(7,size*0.0095)}px JetBrains Mono`;
  ctx.textAlign='center';
  ctx.fillText('REYKJAVÍK', 0, 0);
  ctx.restore();

  // Tick at start
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(START_ANGLE)*outerR, cy+Math.sin(START_ANGLE)*outerR);
  ctx.lineTo(cx+Math.cos(START_ANGLE)*(outerR+ringW), cy+Math.sin(START_ANGLE)*(outerR+ringW));
  ctx.strokeStyle='rgba(138,122,104,0.5)'; ctx.lineWidth=0.8; ctx.stroke();
}

// ─────────────────────────────────────────────
// PULSE ANIMATION for latest GPS
// ─────────────────────────────────────────────
function animateLatest() {
  if(!latestGPSPos || !staticCanvas) { requestAnimationFrame(animateLatest); return; }
  const {x,y} = latestGPSPos;
  const canvas = document.getElementById('dial');
  const ctx = canvas.getContext('2d');

  pulsePhase = (pulsePhase + 0.035) % (Math.PI*2);
  const pulse  = 0.5 + 0.5*Math.sin(pulsePhase);
  const pulse2 = 0.5 + 0.5*Math.sin(pulsePhase + Math.PI); // offset second ring
  const pad = 40;

  // Restore static area
  ctx.clearRect(x-pad, y-pad, pad*2, pad*2);
  const r = dialRes;
  ctx.drawImage(staticCanvas, (x-pad)*r,(y-pad)*r,pad*2*r,pad*2*r, x-pad,y-pad,pad*2,pad*2);

  // Outer pulse ring (slow, wide)
  ctx.beginPath();
  ctx.arc(x, y, 12 + pulse*16, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(192,96,80,${0.05 + 0.12*(1-pulse)})`;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Inner pulse ring (offset phase, tighter)
  ctx.beginPath();
  ctx.arc(x, y, 9 + pulse2*8, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(192,96,80,${0.10 + 0.18*(1-pulse2)})`;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Core dot — larger
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI*2);
  ctx.fillStyle = '#c06050';
  ctx.fill();
  ctx.strokeStyle = 'rgba(242,237,227,0.95)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Pin icon above — bigger
  ctx.save();
  ctx.globalAlpha = 1.0;
  ctx.font = `18px ${EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('📍', x, y-7);
  ctx.restore();

  requestAnimationFrame(animateLatest);
}

function captureStatic() {
  staticCanvas = document.createElement('canvas');
  const src = document.getElementById('dial');
  staticCanvas.width=src.width; staticCanvas.height=src.height;
  staticCanvas.getContext('2d').drawImage(src,0,0);
}

// ─────────────────────────────────────────────
// TOOLTIP
// ─────────────────────────────────────────────
let tooltipEl = null;

function createTooltip() {
  tooltipEl = document.createElement('div');
  tooltipEl.style.cssText = `
    display:none; position:fixed; z-index:400;
    background:#2a2118; color:#f2ede3;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    padding:5px 10px; border-radius:3px; pointer-events:none;
    white-space:nowrap; letter-spacing:0.06em;
    box-shadow:2px 3px 10px rgba(0,0,0,0.3);
  `;
  document.body.appendChild(tooltipEl);
}

function showTooltip(text, clientX, clientY) {
  if(!tooltipEl) return;
  tooltipEl.textContent = text;
  tooltipEl.style.display = 'block';
  let left = clientX + 12;
  let top  = clientY - 28;
  if(left + 300 > window.innerWidth - 4) left = clientX - 304;
  if(top < 4) top = clientY + 12;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top  = top  + 'px';
}

function hideTooltip() {
  if(tooltipEl) tooltipEl.style.display = 'none';
}

// Neighbouring notes/pins have overlapping hit circles: pick the closest one, not the first
function nearestHit(areas, mx, my) {
  let best = null, bestD = Infinity;
  for(const h of areas) {
    const d = Math.hypot(mx-h.x, my-h.y);
    if(d <= h.r && d < bestD) { best = h; bestD = d; }
  }
  return best;
}

// ─────────────────────────────────────────────
// HIT DETECTION — ring + day under cursor
// ─────────────────────────────────────────────
// We need to know layout params at event time
let layoutParams = null;

function getLayoutParams(canvas) {
  const size = canvas.width / dialRes;
  const cx = size/2, cy = size/2;
  const innerR = size * 0.14;
  const outerR = size * 0.46;
  const ringW  = (outerR - innerR) / RINGS.length;
  return { cx, cy, innerR, outerR, ringW, size };
}

function hitTestCanvas(mx, my, canvas, days) {
  const {cx, cy, innerR, outerR, ringW} = getLayoutParams(canvas);
  const dx = mx - cx, dy = my - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < innerR || dist > outerR + ringW*2) return null;

  // Which ring?
  const ringIdx = Math.floor((dist - innerR) / ringW);
  const ring = RINGS[ringIdx] || null;

  // Which day? (counterclockwise)
  let angle = Math.atan2(dy, dx);
  // Normalize relative to START_ANGLE, counterclockwise
  let relAngle = START_ANGLE - angle;
  while(relAngle < 0) relAngle += Math.PI*2;
  while(relAngle >= Math.PI*2) relAngle -= Math.PI*2;

  const N = days.length;
  const wedgeA = (Math.PI*2) / N;
  const dayIdx = Math.floor(relAngle / wedgeA);
  const day = (dayIdx >= 0 && dayIdx < N) ? days[dayIdx] : null;

  return { ring, day, dayIdx, dist, ringIdx };
}

// ─────────────────────────────────────────────
// ZOOM & PAN
// ─────────────────────────────────────────────
let zoomScale = 1;
let zoomTx = 0, zoomTy = 0;
let isPanning = false;
let panStart = { x:0, y:0 };
let panOrigin = { tx:0, ty:0 };
const MIN_ZOOM = 0.3, MAX_ZOOM = 8;

function applyZoom(canvas) {
  canvas.style.transformOrigin = '0 0';
  canvas.style.transform = `translate(${zoomTx}px, ${zoomTy}px) scale(${zoomScale})`;
}

function zoomAt(clientX, clientY, factor, canvas) {
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  const my = clientY - rect.top;
  const newScale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoomScale * factor));
  const ratio = newScale / zoomScale;
  zoomTx = mx - ratio * (mx - zoomTx);
  zoomTy = my - ratio * (my - zoomTy);
  zoomScale = newScale;
  applyZoom(canvas);
}

function zoomBy(factor) {
  const canvas = document.getElementById('dial');
  const wrap = document.getElementById('diary-canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  zoomAt(rect.left + rect.width/2, rect.top + rect.height/2, factor, canvas);
}

// Opening view. On phones start at half size, centred sideways, so more of the circle shows.
function resetZoom() {
  const canvas = document.getElementById('dial');
  const wrapW = document.getElementById('diary-canvas-wrap').clientWidth;
  if(window.innerWidth <= 700) {
    zoomScale = 0.5;
    zoomTx = (wrapW - parseFloat(canvas.style.width) * zoomScale) / 2;
  } else {
    zoomScale = 1; zoomTx = 0;
  }
  zoomTy = 0;
  applyZoom(canvas);
}

// ─────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────
function setupCanvasEvents(canvas, days) {
  createTooltip();

  const onHover = e => {
    if(isPanning) return;
    const wrap = document.getElementById('diary-canvas-wrap');
    const wRect = wrap.getBoundingClientRect();

    // Map screen coords → canvas pixel coords, undoing the CSS translate+scale transform
    const localX = (e.clientX - wRect.left - zoomTx) / zoomScale;
    const localY = (e.clientY - wRect.top  - zoomTy) / zoomScale;
    // Hit areas are in CSS pixels; the canvas backing store is dialRes times larger
    const mx = localX;
    const my = localY;

    const noteHit = nearestHit(noteHitAreas, mx, my);
    if(noteHit) {
      canvas.style.cursor = 'pointer';
      const popup = document.getElementById('dnp');
      document.getElementById('dnpd').textContent = `Day ${noteHit.dayNum} · ${noteHit.date}`;
      document.getElementById('dnpt').textContent = noteHit.note;
      popup.classList.add('show');
      const wrap = document.getElementById('diary-canvas-wrap');
      const wRect = wrap.getBoundingClientRect();
      const pw = 240;
      let left = e.clientX - wRect.left + 14;
      let top  = e.clientY - wRect.top  - 18;
      if(left + pw > wrap.clientWidth - 8) left = e.clientX - wRect.left - pw - 14;
      if(top + 120 > wrap.clientHeight - 8) top = wrap.clientHeight - 128;
      if(top < 4) top = 4;
      popup.style.left = left + 'px';
      popup.style.top  = top  + 'px';
      hideTooltip();
      return;
    }
    document.getElementById('dnp').classList.remove('show');

    const gpsHit = nearestHit(gpsHitAreas, mx, my);
    if(gpsHit) {
      canvas.style.cursor = 'pointer';
      showTooltip(`Location: open in map · Day ${gpsHit.dayNum}`, e.clientX, e.clientY);
      return;
    }

    const labelHit = nearestHit(dayLabelHitAreas, mx, my);
    if(labelHit) {
      canvas.style.cursor = 'default';
      showTooltip(`Day ${labelHit.dayNum}: ${formatDate(labelHit.date)}`, e.clientX, e.clientY);
      return;
    }

    const hit = hitTestCanvas(mx, my, canvas, days);
    if(hit && hit.ring && hit.day) {
      canvas.style.cursor = 'default';
      const val = dayValue(hit.day, hit.ring);
      let label = hit.ring.label;
      let valStr = '';
      if(val !== null) {
        if(hit.ring.type === 'iconscale' || hit.ring.type === 'pace') {
          const n = Math.max(1, Math.min(5, Math.round(val)));
          const VERBAL = {
            Sleep_Quality: ['terrible sleep','poor sleep','okay sleep','good sleep','excellent sleep'],
            Tiredness:     ['fresh','slightly tired','tired','very tired','exhausted'],
            Cold:          ['sweating','comfortable','cold','very cold','freezing'],
            Wind_Scale:    ['calm','light breeze','windy','very windy','storm force'],
            Solitude:      ['total loneliness','getting lonely','neutral','embracing solitude','total solitude'],
            Trolley:       ['very light load','light load','medium load','heavy load','crushing load'],
            Pace:          ['very slow','slow','normal pace','fast','hype pace'],
          };
          if(hit.ring.key === 'Solitude') {
            valStr = VERBAL.Solitude[n-1];
          } else if(hit.ring.key === 'Trolley') {
            valStr = `${n}, ${VERBAL.Trolley[n-1]}`;
          } else {
            const verbal = VERBAL[hit.ring.key];
            valStr = verbal ? `${n}/5, ${verbal[n-1]}` : `${n}/5`;
          }
        } else if(hit.ring.type === 'wxicon') {
          valStr = dayWeatherText(hit.day);
        } else if(hit.ring.type === 'terrain') {
          valStr = dayTerrainText(hit.day);
        } else if(hit.ring.type === 'state') {
          const parts = [];
          if(val.trance) parts.push('Trance');
          if(val.loop)   parts.push('Mind loop');
          if(val.pain)   parts.push('Pain');
          valStr = parts.join(', ');
        } else if(hit.ring.type === 'encounters') {
          const parts = [];
          if(val.humans) parts.push('Humans');
          if(val.animStr) parts.push(val.animStr.split(/[;,]/).map(a=>a.trim()).filter(Boolean).join(', '));
          valStr = parts.join(', ');
        } else if(hit.ring.type === 'gps') {
          valStr = 'location recorded';
        } else if(hit.ring.type === 'note') {
          valStr = 'has note';
        } else {
          valStr = 'yes';
        }
      } else {
        valStr = 'not recorded';
      }
      showTooltip(`${label}: ${valStr} · Day ${hit.day.dayNum}`, e.clientX, e.clientY);
    } else {
      canvas.style.cursor = isPanning ? 'grabbing' : 'grab';
      hideTooltip();
    }
  };
  canvas.addEventListener('mousemove', onHover);

  canvas.addEventListener('mouseleave', () => {
    document.getElementById('dnp').classList.remove('show');
    hideTooltip();
  });

  canvas.addEventListener('click', e => {
    if(isPanning) return;
    const wrap = document.getElementById('diary-canvas-wrap');
    const wRect = wrap.getBoundingClientRect();
    const mx = (e.clientX - wRect.left - zoomTx) / zoomScale;
    const my = (e.clientY - wRect.top  - zoomTy) / zoomScale;

    // Note click → open tracker centered on that day's GPS with note
    const noteHitClick = nearestHit(noteHitAreas, mx, my);
    if(noteHitClick) {
      openInTracker(noteHitClick.lat, noteHitClick.lon, noteHitClick.note, noteHitClick.dayNum, noteHitClick.date);
      return;
    }

    // GPS click → open tracker centered on that pin
    const gpsHit = nearestHit(gpsHitAreas, mx, my);
    if(gpsHit && gpsHit.lat && gpsHit.lon) {
      openInTracker(gpsHit.lat, gpsHit.lon, null, gpsHit.dayNum, null);
    }
  });

  canvas.addEventListener('mousedown', e => {
    if(e.button !== 0) return;
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY };
    panOrigin = { tx: zoomTx, ty: zoomTy };
    document.getElementById('diary-canvas-wrap').classList.add('pan');
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if(!isPanning) return;
    zoomTx = panOrigin.tx + (e.clientX - panStart.x);
    zoomTy = panOrigin.ty + (e.clientY - panStart.y);
    applyZoom(canvas);
  });

  window.addEventListener('mouseup', () => {
    if(!isPanning) return;
    isPanning = false;
    document.getElementById('diary-canvas-wrap').classList.remove('pan');
  });

  let touchStartDist = null;
  let touchStartScale = 1;
  let touchStartMid = { x:0, y:0 };
  // Tap = one finger, short, barely moved. Phones have no hover, so a tap shows
  // what hover shows; a second tap on the same note or pin opens it in the tracker.
  let tapStart = null;
  let tapTarget = null;

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    tapStart = e.touches.length === 1
      ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }
      : null;
    if(e.touches.length === 1) {
      isPanning = true;
      panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      panOrigin = { tx: zoomTx, ty: zoomTy };
    } else if(e.touches.length === 2) {
      isPanning = false;
      const t0 = e.touches[0], t1 = e.touches[1];
      touchStartDist = Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY);
      touchStartScale = zoomScale;
      touchStartMid = { x:(t0.clientX+t1.clientX)/2, y:(t0.clientY+t1.clientY)/2 };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(tapStart && (e.touches.length > 1 ||
       Math.hypot(e.touches[0].clientX - tapStart.x, e.touches[0].clientY - tapStart.y) > 8)) tapStart = null;
    if(e.touches.length === 1 && isPanning) {
      zoomTx = panOrigin.tx + (e.touches[0].clientX - panStart.x);
      zoomTy = panOrigin.ty + (e.touches[0].clientY - panStart.y);
      applyZoom(canvas);
    } else if(e.touches.length === 2 && touchStartDist) {
      const t0 = e.touches[0], t1 = e.touches[1];
      const dist = Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY);
      const factor = dist / touchStartDist;
      const newScale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, touchStartScale * factor));
      const ratio = newScale / zoomScale;
      zoomTx = touchStartMid.x - ratio * (touchStartMid.x - zoomTx);
      zoomTy = touchStartMid.y - ratio * (touchStartMid.y - zoomTy);
      zoomScale = newScale;
      applyZoom(canvas);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    isPanning = false;
    touchStartDist = null;
    if(!tapStart || e.touches.length > 0 || Date.now() - tapStart.t > 500) { tapStart = null; return; }
    const t = e.changedTouches[0];
    tapStart = null;

    const wRect = document.getElementById('diary-canvas-wrap').getBoundingClientRect();
    const mx = (t.clientX - wRect.left - zoomTx) / zoomScale;
    const my = (t.clientY - wRect.top  - zoomTy) / zoomScale;
    const noteHit = nearestHit(noteHitAreas, mx, my);
    const gpsHit  = noteHit ? null : nearestHit(gpsHitAreas, mx, my);
    const target  = noteHit ? 'note' + noteHit.dayNum : gpsHit ? 'gps' + gpsHit.dayNum : null;

    if(target && target === tapTarget) {
      tapTarget = null;
      document.getElementById('dnp').classList.remove('show');
      hideTooltip();
      if(noteHit) openInTracker(noteHit.lat, noteHit.lon, noteHit.note, noteHit.dayNum, noteHit.date);
      else if(gpsHit.lat && gpsHit.lon) openInTracker(gpsHit.lat, gpsHit.lon, null, gpsHit.dayNum, null);
      return;
    }
    tapTarget = target;
    onHover({ clientX: t.clientX, clientY: t.clientY });
  });

  // Only the radial's own area: elsewhere (the Field Diary list) the wheel scrolls normally
  document.getElementById('diary-canvas-wrap').addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.9, canvas);
  }, { passive: false });

  canvas.addEventListener('dblclick', resetZoom);
}

function travelFor(day, a, b) {
  const ta = (a.Time || '').slice(0,5), tb = (b.Time || '').slice(0,5);
  return TRAVEL.find(t => t.date === day && ta >= t.from && tb <= t.to) || null;
}
// Day colour deepens along the trip: first day lighter blue, last day navy.
// The light end keeps about 4.5:1 contrast with the white day numbers on the markers.
const DAY_COLOR_FIRST = '#4e7aa8';
const DAY_COLOR_LAST  = '#1b3557';
function dayColorAt(t) {
  const ch = (hex, i) => parseInt(hex.substr(1 + i*2, 2), 16);
  return '#' + [0,1,2].map(i =>
    Math.round(ch(DAY_COLOR_FIRST, i) * (1-t) + ch(DAY_COLOR_LAST, i) * t).toString(16).padStart(2, '0')
  ).join('');
}

// Convert diary demo days → flat allEntries for tracker
function loadDemoIntoTracker() {
  const days = sharedDemoDays || generateDemoData();
  allEntries = [];
  const weatherTemps = {'Sun':14,'Partly Cloudy':10,'Cloud':8,'Rain':7,'Wind':6,'Storm':5,'Fog':6,'Snow':1};
  const windSpeeds = {1:1,2:4,3:8,4:14,5:20};

  days.forEach(day => {
    day.entries.forEach(e => {
      const wx = e.Weather || 'Partly Cloudy';
      const windN = parseInt(e.Wind_Scale) || 2;
      const tempC = (weatherTemps[wx] || 8) + Math.round((Math.random()-0.5)*4);
      allEntries.push({
        ...e,
        Date: day.date,
        Time: '09:00',
        Timestamp: day.date,
        Weather_Auto: wx + ` ${tempC}°C`,
        Temp_C: String(tempC),
        Feels_C: String(tempC - 3),
        Wind_ms: String(windSpeeds[windN] || 6),
        Precip_mm: wx==='Rain'||wx==='Storm' ? String(Math.round(Math.random()*8)) : '0',
      });
    });
  });

  if (!allEntries.length) return;
  render();
  setLiveStatus('ok');
  document.getElementById('last-update').textContent = `DEMO · ${days.length} days`;
  hideLoading();
}


function scheduleMidnightRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0); // next midnight
  const msUntilMidnight = midnight - now;
  refreshTimer = setTimeout(() => {
    loadData();
    scheduleMidnightRefresh(); // reschedule for next midnight
  }, msUntilMidnight);
}

// Photos on the map: photos.json lists them, photos/ holds the web copies, photos/thumbs/ the round markers.
// Above the day markers; a click opens the full photo in the lightbox.
function addPhotosLayer() {
  map.createPane('photos');

  const layer = L.layerGroup().addTo(map);
  layersControl.addOverlay(layer, 'Photos');
  // Zoomed out (below PHOTO_ZOOM) every photo spot is a small dot; a click zooms in there.
  // Zoomed in, thumbnails sit up and to the right of where the photo was taken, so the day marker
  // under that spot stays visible; a small dot marks the exact place. Photos within 40 m fan out.
  const PHOTO_ZOOM = 9;
  const thumbs = L.layerGroup(), dots = L.layerGroup();
  const showForZoom = () => {
    const near = map.getZoom() >= PHOTO_ZOOM;
    layer.removeLayer(near ? dots : thumbs);

      let spot = spots.find(s => map.distance([s.lat, s.lon], [p.lat, p.lon]) < 40);
      if (!spot) {
        spot = { lat: p.lat, lon: p.lon, n: 0 };
        spots.push(spot);
        L.circleMarker([p.lat, p.lon], {
          pane: 'photos', radius: 3, weight: 1.5, color: '#fff', fillColor: '#2a2118', fillOpacity: 1, interactive: false
        }).addTo(thumbs);

        }).on('click', () => map.setView([p.lat, p.lon], PHOTO_ZOOM + 2)).addTo(dots);

                          iconSize: [48, 48], iconAnchor: [-8 - spot.n * 52, 56] })

}
