// Photos on the map: photos.json lists them, photos/ holds the web copies, photos/thumbs/ the round markers.
// Above the day markers; a click opens the full photo in the lightbox.
function addPhotosLayer() {
  map.createPane('photos');
  map.getPane('photos').style.zIndex = 650;
  const layer = photosLayer = L.layerGroup().addTo(map);
  layersControl.addOverlay(layer, 'Photos');
  // Zoomed out (below PHOTO_ZOOM) every photo spot is a small dot; a click zooms in there.
  // Zoomed in, thumbnails sit up and to the right of where the photo was taken, so the day marker
  // under that spot stays visible; a small dot marks the exact place. Photos within 40 m fan out.
  const PHOTO_ZOOM = 9;
  const thumbs = L.layerGroup(), dots = L.layerGroup();
  const showForZoom = () => {
    const near = map.getZoom() >= PHOTO_ZOOM;
    layer.removeLayer(near ? dots : thumbs);
    layer.addLayer(near ? thumbs : dots);
  };
  map.on('zoomend', showForZoom);
  showForZoom();
  const spots = [];
  fetch('photos.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(list => (photosList = list).forEach(p => {
      let spot = spots.find(s => map.distance([s.lat, s.lon], [p.lat, p.lon]) < 40);
      if (!spot) {
        spot = { lat: p.lat, lon: p.lon, n: 0 };
        spots.push(spot);
        L.circleMarker([p.lat, p.lon], {
          pane: 'photos', radius: 3, weight: 1.5, color: '#fff', fillColor: '#2a2118', fillOpacity: 1, interactive: false
        }).addTo(thumbs);
        L.circleMarker([p.lat, p.lon], {
          pane: 'photos', radius: 4, weight: 1.5, color: '#fff', fillColor: '#2a2118', fillOpacity: 1
        }).on('click', () => map.setView([p.lat, p.lon], PHOTO_ZOOM + 2)).addTo(dots);
      }
      L.marker([spot.lat, spot.lon], {
        pane: 'photos',
        icon: L.divIcon({ className: 'photo-marker', html: `<img src="photos/thumbs/${p.id}.jpg" alt="">`,
                          iconSize: [48, 48], iconAnchor: [-8 - spot.n * 52, 56] })
      }).on('click', () => openLightbox(p)).addTo(thumbs);
      spot.n++;
    }))
    .catch(() => {});
}

async function bioInit() {
  try {
    const rows = d_parseCSV(await fetch(BIO_URL + '&t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()));

const BIO_MULTI_ORDER = ['steps', 'total_calories_kcal', 'gain_meters', 'avg_walking_hr', 'cardio_load', 'walking_skin_temp', 'sleep_score'];
function bioInitMulti() {
  const box = document.getElementById('bio-multi');
  box.innerHTML = BIO_MULTI_ORDER.map(k =>
    `<section class="bio-mini"><h3 style="color:${BIO_METRICS[k].color}">${BIO_METRICS[k].label}</h3><div class="bio-mini-chart"><canvas id="bio-mini-${k}"></canvas></div></section>`).join('');

                           borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {

function bioRenderCards() {
  const max = k => Math.max(...bioData.map(d => d[k]).filter(x => x != null));
  const n = (x, dec = 0) => x.toLocaleString('en-GB', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const short = s => { const [d, m] = s.split('/'); return new Date(2026, m - 1, d).toLocaleDateString('en-GB', { month: 'short', day: '2-digit' }); };
  const cards = [
    // Totals and averages: the published figures (the trip is "3,200 km"), not recalculated from the daily rows
    ['Total distance',  '3,208', 'km',                   `Max day: ${n(max('distance_km'), 1)} km`, '#4f8a6e'],               // fixed
    ['Total steps',     '4,348,746', '',                 `Max day: ${n(max('steps'))}`, BIO_METRICS.steps.color],              // fixed
    ['Total calories',  '425,813', 'kcal',               'Basal + active TEE', BIO_METRICS.total_calories_kcal.color],         // fixed
    ['Vertical gain',   '22,116', 'm',                   `Max day: ${n(max('gain_meters'))} m`, BIO_METRICS.gain_meters.color], // fixed
    ['Peak heart rate', '198.0', 'BPM',                  'Max peak (Aug 04)', BIO_METRICS.avg_walking_hr.color],             // fixed
    ['Avg walking HR',  '106.8', 'BPM',                  'Aerobic baseline', BIO_METRICS.avg_walking_hr.color],              // fixed
    ['Avg sleep score', '76.4', '/100',                  `Peak: ${n(max('sleep_score'))} / 100`, BIO_METRICS.sleep_score.color], // fixed
    ['Coldest dip',     '10.9', '°C',                    'Peak cold (July 29)', BIO_METRICS.cardio_load.color],              // fixed
    ['Max altitude',    n(max('gain_meters')), 'm',      'Peak single ascent', BIO_METRICS.gain_meters.color],
    ['Max activity',    '15.5', 'hrs/day',               'Peak duration', BIO_METRICS.cardio_load.color],                    // fixed
    ['Max km/day',      n(max('distance_km'), 1), 'km',  'Peak distance', '#4f8a6e'],
    ['Peak cardio',     '4.37', '',                      'Max load index', BIO_METRICS.cardio_load.color],                   // fixed
  ];
  document.getElementById('bio-cards').innerHTML = cards.map(([l, v, u, s, c]) =>
    `<div class="bio-card"><div class="l">${l}</div><div class="v">${v} <small>${u}</small></div><div class="s" style="color:${c}">${s}</div></div>`).join('');
  document.getElementById('bio-range').textContent = `${short(bioData[0].date)} – ${short(bioData[bioData.length - 1].date)}`;
}

function bioRenderToggles() {
  const box = document.getElementById('bio-toggles');
  box.innerHTML = '';
  for (const [k, m] of Object.entries(BIO_METRICS)) {
    const on = bioActive.has(k);
    const lab = document.createElement('label');
    lab.className = 'bio-tog' + (on ? ' on' : '');
    lab.innerHTML = `<input type="checkbox" ${on ? 'checked' : ''}><span class="dot" style="background:${m.color}"></span><span>${m.label}</span>`;
    lab.querySelector('input').onchange = e => {
      e.target.checked ? bioActive.add(k) : bioActive.delete(k);
      lab.classList.toggle('on', e.target.checked);
      bioUpdate();
    };
    box.appendChild(lab);
  }
}

function bioSetMode(norm) {
  bioNormalized = norm;
  document.getElementById('bio-norm').classList.toggle('on', norm);
  document.getElementById('bio-abs').classList.toggle('on', !norm);
  bioUpdate();
}

function bioSeries(k) {
  const e = bioExt[k], span = e.max - e.min;
  return bioData.map(d => d[k] == null ? null : bioNormalized ? (span === 0 ? 0 : (d[k] - e.min) / span * 100) : d[k]);
}

function bioInitChart() {
  const keys = Object.keys(BIO_METRICS);
  bioChart = new Chart(document.getElementById('bioChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: bioData.map(d => d.date.slice(0, 5)),
      datasets: keys.map(k => ({
        label: BIO_METRICS[k].label, data: bioSeries(k),
        borderColor: BIO_METRICS[k].color, backgroundColor: BIO_METRICS[k].color + '22',
        borderWidth: 2, pointRadius: 2, pointHoverRadius: 6, tension: 0.2, spanGaps: true, hidden: !bioActive.has(k)
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#2a2118', titleColor: '#f2ede3', bodyColor: '#e3dccd', padding: 12, boxPadding: 6, usePointStyle: true,
          titleFont: { family: 'JetBrains Mono' }, bodyFont: { family: 'JetBrains Mono', size: 11 },
          callbacks: {
            label: c => {
              const k = keys[c.datasetIndex], d = bioData[c.dataIndex];
              return ` ${BIO_METRICS[k].label}: ${d[k] == null ? 'N/A' : BIO_METRICS[k].fmt(d[k], d)}`;
            }
          }
        }
      },
      scales: {
        x: { grid: { color: '#e3dccd' }, ticks: { color: '#8a7a68', font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 12 } },
        y: { grid: { color: '#e3dccd' }, max: bioNormalized ? 100 : undefined,
             ticks: { color: '#8a7a68', font: { family: 'JetBrains Mono', size: 10 }, callback: v => bioNormalized ? v + '%' : v } }
      }
    }
  });
  bioUpdateCount();
}

function bioUpdate() {
  if (!bioChart) return;
  Object.keys(BIO_METRICS).forEach((k, i) => {
    bioChart.data.datasets[i].hidden = !bioActive.has(k);
    bioChart.data.datasets[i].data = bioSeries(k);
  });
  bioChart.options.scales.y.max = bioNormalized ? 100 : undefined;
  bioChart.update();
  bioUpdateCount();
}

function bioUpdateCount() {
  document.getElementById('bio-count').textContent = `Showing ${bioActive.size} of ${Object.keys(BIO_METRICS).length} layers`;
}

// Real GPS tracks of the walk (tracks.geojson: simplified once from the full KML, 10 m tolerance).
// Drawn in its own pane under the ride lines and markers; always on. The checkbox box holds the other layers (Photos).
function addGpsTracksLayer() {
  map.createPane('gpsTracks');
  map.getPane('gpsTracks').style.zIndex = 350;
  const layer = gpsTracksLayer = L.layerGroup().addTo(map);   // always shown (hidden only while Play runs)
  layersControl = L.control.layers(null, {}, { collapsed: false, position: 'topright' }).addTo(map);
  fetch('tracks.geojson', { cache: 'no-cache' })   // revalidate, so a rebuilt file shows up at once
    .then(r => r.json())
    .then(gj => {
      gpsTracksData = gj;
      playReady.tracks = true;
      addPlayControl();
      L.geoJSON(gj, {
        pane: 'gpsTracks',
        interactive: false,
        style: { color: '#8e3a2d', weight: 2.5, opacity: 0.8 }
      }).addTo(layer);
    })
    .catch(() => {});
}

// ── PLAY: a terracotta dot walks the GPS tracks from the first walking day ──
// The whole trip takes PLAY_MS at a constant speed. Between tracks, and after the last one through the
// remaining diary entries back to Reykjavík, it rides along dashed lines. The track draws itself behind
// the dot and the map eases after it. Photos and day markers are hidden; each ride appears when the dot reaches its time.
// At the end it stays on the final picture. Any click, tap, wheel, key or tab change (during or after)
// stops it and puts the map back as it was.
const PLAY_MS = 60000, PLAY_ZOOM = 8;
const PLAY_SETTLE_MS = 2500; // time the camera gets to settle on the arrival before the animation stops
const PLAY_TOTAL_KM = 3208;  // the published total the km counter ends on (same as the Biometrics tab)
const dateKey = s => (s || '').split('/').reverse().join('');   // DD/MM/YYYY → YYYYMMDD, sortable
let gpsTracksLayer = null, gpsTracksData = null, photosLayer = null, photosList = [], play = null;
let notesLayer = null, storyLayer = null;

// The Play button appears only once both the GPS tracks and the diary entries are on the map
const playReady = { tracks: false, entries: false, shown: false };
function addPlayControl() {
  if (!playReady.tracks || !playReady.entries || playReady.shown) return;
  playReady.shown = true;
  const Ctl = L.Control.extend({
    onAdd() {
      const btn = L.DomUtil.create('button', 'play-btn');
      btn.innerHTML = '▶ Play';
      btn.title = 'Walk the route from day 5';
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.on(btn, 'click', () => play ? stopPlay() : startPlay());
      return btn;
    }
  });
  new Ctl({ position: 'bottomleft' }).addTo(map);
}

const PLAY_LINE = { pane: 'gpsTracks', color: '#8e3a2d', weight: 3, opacity: 0.9, interactive: false };
const PLAY_GAP  = { ...PLAY_LINE, weight: 2.5, dashArray: '2 7' };   // rides and other jumps between tracks

// Distance along the Play route where something at pt, at time key (YYYYMMDDHH:MM), is passed:
// the route point closest to it, on the stretches whose time span holds it (a track runs until
// the next one starts), else on that day, else where the route next goes on
function playRouteAt(segs, pt, key) {
  let cands = segs.filter(s => s.key <= key && key <= s.until);
  if (!cands.length) cands = segs.filter(s => s.key.startsWith(key.slice(0, 8)));
  if (!cands.length) cands = segs.filter(s => s.key > key).slice(0, 1);
  let at = Infinity, best = Infinity;
  cands.forEach(s => s.pts.forEach((q, i) => { const m = q.distanceTo(pt); if (m < best) { best = m; at = s.from + s.cum[i]; } }));
  return at;
}

// An encounter's place: its own coordinates, or without them the diary entry closest in time that day
function encounterPoint(r) {
  if (!isNaN(toFloat(r.Latitude)) && !isNaN(toFloat(r.Longitude))) return L.latLng(toFloat(r.Latitude), toFloat(r.Longitude));
  const time = (r.Time || '12:00').slice(0, 5), mins = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
  const near = allEntries.filter(e => e.Date === r.Date && hasCoords(e))
    .sort((a, b) => Math.abs(mins(a.Time) - mins(time)) - Math.abs(mins(b.Time) - mins(time)))[0];
  return near ? L.latLng(toFloat(near.Latitude), toFloat(near.Longitude)) : null;
}

// An encounter's Icon cell: an emoji, or the name of an image in the icons/ folder (e.g. trolley_crash.png)
function encounterIconHTML(icon) {
  const v = (icon || '').trim();
  return /\.(png|svg|jpe?g|webp|gif)$/i.test(v) ? `<img class="enc-img" src="icons/${encodeURIComponent(v)}" alt="">` : v;
}

// Story overlay: every encounter as its icon, the name on hover or tap
function renderStory() {
  storyLayer.clearLayers();
  trackerEncounters.forEach(r => {
    const pt = encounterPoint(r);
    if (!pt) return;
    L.marker(pt, { icon: L.divIcon({ className: 'story-icon', html: encounterIconHTML(r.Icon), iconSize: [40, 40] }) })
      .bindTooltip(r.Text || '', { direction: 'top', offset: [0, -18], className: 'story-tip' })
      .addTo(storyLayer);
  });
}

function startPlay() {
  if (!gpsTracksData || play) return;
  // Tracks in walking order; between two tracks a straight "gap" segment, so the dot rides across instead of jumping
  const tracks = gpsTracksData.features
    .filter(f => f.geometry && f.geometry.type === 'LineString')
    .map(f => ({ date: dateKey(f.properties.date), key: dateKey(f.properties.date) + (f.properties.start || ''),
                 pts: f.geometry.coordinates.map(c => L.latLng(c[1], c[0])) }))
    .sort((a, b) => a.key.localeCompare(b.key));
  // The rides drawn on the map (dashed lines), in time order. A gap between two tracks follows the rides in between
  // that start where the dot already is (within 3 km); a ride far from there was recorded by the GPS already
  const ridePaths = markers.filter(m => m instanceof L.Polyline && m.options.rideKey)
    .map(m => ({ key: m.options.rideKey, pts: m.getLatLngs() }))
    .sort((a, b) => a.key.localeCompare(b.key));
  // key / until: when the segment starts and when the next track (or entry) starts, as YYYYMMDDHH:MM,
  // so a ride only shows once the dot gets to it in time (see playFrame)
  const segs = [];
  tracks.forEach((t, i) => {
    const next = tracks[i + 1] ? tracks[i + 1].key : '99';
    if (i) {
      const a = tracks[i - 1], pts = [a.pts[a.pts.length - 1]];
      ridePaths.filter(r => r.key > a.key && r.key < t.key).forEach(r => {
        if (r.pts[0].distanceTo(pts[pts.length - 1]) < 3000) pts.push(...r.pts);
      });
      segs.push({ pts: [...pts, t.pts[0]], gap: true, key: a.key, until: t.key });
    }
    segs.push({ pts: t.pts, gap: false, key: t.key, until: next });
  });
  // After the last track: the diary entries of the following days, through any ride's via points
  const lastTrack = tracks[tracks.length - 1];
  let prev = { pt: lastTrack.pts[lastTrack.pts.length - 1], key: lastTrack.key, raw: null };
  allEntries
    .filter(e => dateKey(e.Date) > lastTrack.date && hasCoords(e))
    .sort((a, b) => (dateKey(a.Date) + a.Time).localeCompare(dateKey(b.Date) + b.Time))
    .forEach(e => {
      const pt = L.latLng(toFloat(e.Latitude), toFloat(e.Longitude)), key = dateKey(e.Date) + e.Time.slice(0, 5);
      const ride = prev.raw && TRAVEL_OVERNIGHT.find(t => t.from === prev.raw && t.to === e.Date);
      const via = ride && ride.via ? ride.via.map(v => L.latLng(v[0], v[1])) : [];
      segs.push({ pts: [prev.pt, ...via, pt], gap: true, key: prev.key, until: key });
      prev = { pt, key, raw: e.Date };
    });
  let total = 0, walked = 0;   // walked: distance on foot only, for the km counter
  segs.forEach(s => {
    s.from = total;
    s.walkedFrom = walked;
    s.cum = [0];
    for (let i = 1; i < s.pts.length; i++) s.cum.push(s.cum[i - 1] + s.pts[i - 1].distanceTo(s.pts[i]));
    total += s.cum[s.cum.length - 1];
    if (!s.gap) walked += s.cum[s.cum.length - 1];
  });
  if (!total) return;

  // Photos, the blue day markers (Notes) and Story are hidden while it plays, and come back as they were
  const photosOn = photosLayer && map.hasLayer(photosLayer);
  const notesOn = map.hasLayer(notesLayer), storyOn = map.hasLayer(storyLayer);
  // Rides (dashed line + its icon, added right after it) are hidden too and appear when the dot gets to them in time
  const rides = [];
  markers.forEach((m, i) => {
    if (!(m instanceof L.Polyline) || !m.options.dashArray || !map.hasLayer(m)) return;
    const icon = markers[i + 1] instanceof L.Marker && markers[i + 1].options.interactive === false ? markers[i + 1] : null;
    rides.push({ layers: icon ? [m, icon] : [m], key: m.options.rideKey || '' });
  });
  // Encounters: where and when, and the point of the route where the dot passes them
  const encounters = trackerEncounters.map(r => {
    const pt = encounterPoint(r);
    if (!pt) return null;
    return { pt, at: playRouteAt(segs, pt, dateKey(r.Date) + (r.Time || '12:00').slice(0, 5)), icon: r.Icon, text: r.Text || '' };
  }).filter(Boolean);
  // One photo per day for the thumbnail: the captioned one if there is one, else the middle one of the day
  const byDate = {};
  photosList.forEach(ph => (byDate[ph.date] = byDate[ph.date] || []).push(ph));
  const pics = Object.values(byDate).map(list => {
    const ph = list.find(x => x.caption) || list[Math.floor(list.length / 2)];
    return { src: `photos/${ph.id}.jpg`, at: playRouteAt(segs, L.latLng(ph.lat, ph.lon), dateKey(ph.date) + ph.time) };
  }).sort((a, b) => a.at - b.at);
  play = { segs, total, walked, si: 0, phase: 'fade', t0: performance.now(), start: 0,
           view: { center: map.getCenter(), zoom: map.getZoom() }, photosOn, notesOn, storyOn, rides, encounters, pics, pi: -1,
           drawn: null, line: null, dot: null, cam: segs[0].pts[0], raf: 0 };
  map.setView(segs[0].pts[0], PLAY_ZOOM, { animate: false });
  document.querySelector('.play-btn').innerHTML = '■ Stop';
  map.getContainer().classList.add('playing');   // hides the layer checkboxes until Play ends
  play.km = L.DomUtil.create('div', 'play-km', map.getContainer());
  play.km.textContent = '0 km';
  // Photo thumbnail, bottom right: two stacked images that crossfade
  play.pic = L.DomUtil.create('div', 'play-pic', map.getContainer());
  play.pic.innerHTML = '<img alt=""><img alt="">';
  // Intro: everything on the map fades out together, then the dot grows at the start, then it walks
  PLAY_FADE_PANES.forEach(n => { const s = map.getPane(n).style; s.transition = `opacity ${PLAY_FADE_MS}ms ease`; s.opacity = 0; });

  // Anything the viewer does ends it (the button's own click is handled by the button)
  play.stopper = ev => { if (!ev.target.closest || !ev.target.closest('.play-btn')) stopPlay(); };
  ['pointerdown', 'wheel', 'keydown'].forEach(t => document.addEventListener(t, play.stopper, true));
  play.raf = requestAnimationFrame(playFrame);
}

// The panes holding day markers, rides, photos and the GPS track (faded as one at the start)
const PLAY_FADE_PANES = ['markerPane', 'overlayPane', 'photos', 'gpsTracks'];
const PLAY_FADE_MS = 2000, PLAY_GROW_MS = 700;
function playFadePanes(opacity) {
  PLAY_FADE_PANES.forEach(n => { const s = map.getPane(n).style; s.transition = 'none'; s.opacity = opacity; });
}

function playFrame(now) {
  const p = play;
  if (!p) return;
  if (p.phase === 'fade') {
    if (now - p.t0 < PLAY_FADE_MS) { p.raf = requestAnimationFrame(playFrame); return; }
    // Faded: take the layers off the map for real, then show the panes again for what Play draws
    if (p.photosOn) map.removeLayer(photosLayer);
    map.removeLayer(gpsTracksLayer);
    map.removeLayer(notesLayer);
    map.removeLayer(storyLayer);
    p.rides.forEach(r => r.layers.forEach(l => map.removeLayer(l)));
    playFadePanes('');
    p.drawn = L.layerGroup().addTo(map);
    p.line = L.polyline([], PLAY_LINE).addTo(p.drawn);
    if (!map.getPane('playDot')) map.createPane('playDot').style.zIndex = 660;   // above everything else on the map
    p.dot = L.circleMarker(p.segs[0].pts[0], { pane: 'playDot', radius: 0, weight: 3, color: '#fff', fillColor: '#8e3a2d', fillOpacity: 1, interactive: false }).addTo(map);
    p.phase = 'grow'; p.t0 = now;
  }
  if (p.phase === 'grow') {
    const g = Math.min(1, (now - p.t0) / PLAY_GROW_MS);
    p.dot.setRadius(15 * (1 - Math.pow(1 - g, 3)));   // ease-out
    if (g < 1) { p.raf = requestAnimationFrame(playFrame); return; }
    p.phase = 'run'; p.start = now;
  }
  const d = Math.min(1, (now - p.start) / PLAY_MS) * p.total;
  // Finished segments stay drawn; a new line (solid for a track, dashed for a gap) starts for the next one
  while (p.si < p.segs.length - 1 && d >= p.segs[p.si + 1].from) {
    p.line.setLatLngs(p.segs[p.si].pts);
    p.si++;
    p.line = L.polyline([], p.segs[p.si].gap ? PLAY_GAP : PLAY_LINE).addTo(p.drawn);
  }
  const s = p.segs[p.si], along = d - s.from;
  let i = 1;
  while (i < s.cum.length - 1 && s.cum[i] < along) i++;
  const len = s.cum[i] - s.cum[i - 1], f = len ? Math.min(1, Math.max(0, (along - s.cum[i - 1]) / len)) : 1;
  const a = s.pts[i - 1], b = s.pts[i] || a;
  const pos = L.latLng(a.lat + (b.lat - a.lat) * f, a.lng + (b.lng - a.lng) * f);
  p.line.setLatLngs(s.pts.slice(0, i).concat(pos));
  p.dot.setLatLng(pos);
  // A ride shows once the dot is past its start time: on a track that began after it,
  // or on the gap that leads to the first track (or entry) after it
  p.rides.forEach(r => {
    if (!r.shown && (s.key > r.key || (s.gap && s.until > r.key))) { r.shown = true; r.layers.forEach(l => l.addTo(map)); }
  });
  // An encounter pops up at its own place when the dot reaches the point of the route closest to it
  p.encounters.forEach(e => {
    if (e.shown || d < e.at) return;
    e.shown = true;
    if (!map.getPane('playEnc')) map.createPane('playEnc').style.zIndex = 655;   // just under the dot
    L.marker(e.pt, { pane: 'playEnc', interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0],
      html: `<div class="enc-pop"><span class="enc-icon">${encounterIconHTML(e.icon)}</span>${e.text ? `<span class="enc-text">${e.text}</span>` : ''}</div>` }) })
      .addTo(p.drawn);
  });
  // GPS misses distance on foot, so the counter is scaled to end on the published total
  const walkedNow = s.walkedFrom + (s.gap ? 0 : Math.min(along, s.cum[s.cum.length - 1]));
  p.km.textContent = Math.round(walkedNow / p.walked * PLAY_TOTAL_KM).toLocaleString('en-GB') + ' km';
  // The thumbnail shows the day's photo once the dot passes where it was taken
  let pi = p.pi;
  while (pi < p.pics.length - 1 && d >= p.pics[pi + 1].at) pi++;
  if (pi !== p.pi) {
    p.pi = pi;
    const [a, b] = p.pic.querySelectorAll('img'), back = a.classList.contains('on') ? b : a, front = back === a ? b : a;
    back.onload = () => { if (p.pi === pi) { back.classList.add('on'); front.classList.remove('on'); p.pic.classList.add('show'); } };
    back.src = p.pics[pi].src;
    if (p.pics[pi + 1]) new Image().src = p.pics[pi + 1].src;   // preload the next one
  }
  // The camera eases after the dot instead of locking onto it, so GPS wiggles don't shake the map;
  // it keeps easing during the pause at the end, so it settles on the arrival instead of freezing short of it
  p.cam = L.latLng(p.cam.lat + (pos.lat - p.cam.lat) * 0.04, p.cam.lng + (pos.lng - p.cam.lng) * 0.04);
  map.panTo(p.cam, { animate: false });
  if (d >= p.total && !p.endAt) p.endAt = now;
  // At the end the camera settles on the arrival, then everything stays as it is until the viewer clicks or moves
  if (!(p.endAt && now - p.endAt > PLAY_SETTLE_MS)) p.raf = requestAnimationFrame(playFrame);
}

function stopPlay() {
  const p = play;
  if (!p) return;
  play = null;
  cancelAnimationFrame(p.raf);
  ['pointerdown', 'wheel', 'keydown'].forEach(t => document.removeEventListener(t, p.stopper, true));
  playFadePanes('');   // in case it was stopped during the fade
  if (p.drawn) map.removeLayer(p.drawn);
  if (p.dot) map.removeLayer(p.dot);
  p.km.remove();
  p.pic.remove();
  gpsTracksLayer.addTo(map);
  if (p.photosOn) photosLayer.addTo(map);
  if (p.notesOn) notesLayer.addTo(map);
  if (p.storyOn) storyLayer.addTo(map);
  p.rides.forEach(r => r.layers.forEach(l => l.addTo(map)));
  map.setView(p.view.center, p.view.zoom, { animate: false });
  document.querySelector('.play-btn').innerHTML = '▶ Play';
  map.getContainer().classList.remove('playing');
}

// ── LOAD DATA ──────────────────────────────────────────
async function loadData() {
  if (!SHEET_CSV_URL) return;
  document.getElementById('loading-msg').textContent = 'Fetching latest entries…';

  // Always clear stale data before fetching
  allEntries = [];

  try {
    // Force bypass of all caches — unique timestamp + cache:no-store
    const url = SHEET_CSV_URL + '&t=' + Date.now() + '&r=' + Math.random();

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);

    const res = await fetch(url, {
      signal: controller.signal,
      cache: 'no-store',
      headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
    });
    clearTimeout(timeout);

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();

    if (!csv || csv.trim().length < 10) throw new Error('Empty response from sheet');

    allEntries = parseCSV(csv);

    // Daily biometrics for the day boxes; the log still renders without them
    try {
      const bio = parseCSV(await fetch(BIO_URL + '&t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()));
      trackerBio = Object.fromEntries(bio.map(b => [b.Date, b]));
    } catch (e) { trackerBio = {}; }
    // Hand-picked encounters that pop up during Play
    try {
      trackerEncounters = parseCSV(await fetch(ENC_URL + '&t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()))
        .filter(r => r.Date && r.Icon);
    } catch (e) { trackerEncounters = []; }

    if (!allEntries.length) {
      // Clear any old markers from previous load
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      document.getElementById('log-list').innerHTML = '<div style="padding:24px 18px;font-family:var(--font-mono);font-size:11px;color:var(--muted)">No entries in sheet yet.</div>';
      hideLoading();
      return;
    }

    render();
    renderStory();

  } catch(e) {
    let msg = e.message;
    if (e.name === 'AbortError') msg = 'Request timed out';
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) msg = 'Network error — check sheet is published publicly';
    document.getElementById('loading-msg').textContent = '⚠ ' + msg + '. Reload the page to try again.';
  }

  hideLoading();
}

// ── COORDINATE HELPER ──────────────────────────────────
// Handles both "52.5154663" and "52,5154663" (Italian locale)
function toFloat(val) {
  if (!val) return NaN;
  return parseFloat(String(val).replace(',', '.'));
}
function hasCoords(e) {
  return !isNaN(toFloat(e.Latitude)) && !isNaN(toFloat(e.Longitude));
}
function render() {
  if (!allEntries.length) return;

  // Group by date
  const byDay = {};
  allEntries.forEach(e => {
    const day = e.Date || e.Timestamp?.split('T')[0] || 'Unknown';
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(e);
  });

  // Sort days by the actual dayNum stored in entries (not lexicographic string sort)
  // This handles DD/MM/YYYY format which sorts wrong alphabetically
  const days = Object.keys(byDay).sort((a, b) => {
    const numA = parseInt(byDay[a][0]?.dayNum) || 0;
    const numB = parseInt(byDay[b][0]?.dayNum) || 0;
    if (numA && numB) return numA - numB;
    // Fallback: parse DD/MM/YYYY
    const parseDate = s => { const p = s.split('/'); return p.length===3 ? new Date(p[2],p[1]-1,p[0]) : new Date(s); };
    return parseDate(a) - parseDate(b);
  });

  // Build a dayNum lookup: date string → sequential number (1-based)
  const dayNumMap = {};
  days.forEach((d, i) => {
    // Use stored dayNum if available, else sequential index
    const storedNum = parseInt(byDay[d][0]?.dayNum);
    dayNumMap[d] = storedNum || (i + 1);
    byDay[d].forEach(e => { e._dayNum = dayNumMap[d]; }); // for the detail window title
  });

  // Order the detail window's arrows step through: days in order, morning to night within a day
  detailOrder = days.flatMap(d => [...byDay[d]].sort((a, b) => (a.Timestamp || '').localeCompare(b.Timestamp || '')));

  // Assign colors per day
  days.forEach((d, i) => { dayColors[d] = dayColorAt(days.length > 1 ? i / (days.length - 1) : 0); });

  // Render map and log, passing dayNumMap so markers show correct numbers
  renderMap(byDay, days, dayNumMap);
  renderLog(byDay, days, dayNumMap);
}

// ── OSRM ROUTING ───────────────────────────────────────
// Fetches a walking route between two points from OSRM public API
// Returns array of [lat,lon] pairs, or null if routing fails
async function fetchOSRMRoute(from, to) {
  try {
    // OSRM expects lon,lat order
    const url = `https://router.project-osrm.org/route/v1/foot/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
    const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (!res.ok) return null;
    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes?.length) return null;
    // GeoJSON coords are [lon, lat] — flip to [lat, lon] for Leaflet
    return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
  } catch(e) {
    return null; // timeout or network error → fallback to straight line
  }
}

// ── MAP RENDER ─────────────────────────────────────────
async function renderMap(byDay, days, dayNumMap) {
  // Clear old layers
  markers.forEach(m => map.removeLayer(m));
  notesLayer.clearLayers();
  markers = [];
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }

  const allCoords = [];

  // Collect all coords in order, keyed to their day
  const dayCoordMap = {};
  days.forEach((day, dayIdx) => {
    const entries = byDay[day];
    const coords = entries.map(e => {
      const lat = toFloat(e.Latitude), lon = toFloat(e.Longitude);
      return isNaN(lat) || isNaN(lon) ? null : [lat, lon];
    }).filter(Boolean);
    dayCoordMap[day] = coords;
    coords.forEach(c => allCoords.push(c));
  });

  // Draw one continuous line through the whole route, coloured per day segment
  days.forEach((day, dayIdx) => {
    const color = dayColors[day];
    const coords = dayCoordMap[day];
    if (!coords.length) return;

    // The walking itself is shown by the GPS tracks; only rides (TRAVEL lists) get a line here, dotted with an icon.
    // Ride from the previous day's last point to this day's first point
    if (dayIdx > 0) {
      const prevCoords = dayCoordMap[days[dayIdx - 1]];
      const ride = TRAVEL_OVERNIGHT.find(t => t.from === days[dayIdx - 1] && t.to === day);
      if (prevCoords && prevCoords.length && ride) {
        const a = ride.start || prevCoords[prevCoords.length - 1], via = ride.via || [];
        markers.push(L.polyline([a, ...via, coords[0]], {
          color: color, weight: 2.5, opacity: 0.85, dashArray: '2 7', rideDate: days[dayIdx - 1],
          rideKey: dateKey(days[dayIdx - 1]) + '24:00'   // overnight: after everything that day, for Play
        }).addTo(map));
        addTravelIcon(via[0] || [(a[0] + coords[0][0]) / 2, (a[1] + coords[0][1]) / 2], ride.mode);
      }
    }

    // Rides within the day
    const located = [...byDay[day]]
      .sort((a, b) => (a.Timestamp || '').localeCompare(b.Timestamp || ''))
      .filter(e => !isNaN(toFloat(e.Latitude)) && !isNaN(toFloat(e.Longitude)));
    located.forEach((e, i) => {
      const prev = located[i - 1];
      const trip = prev ? travelFor(day, prev, e) : null;
      if (!trip) return;
      const p = [toFloat(prev.Latitude), toFloat(prev.Longitude)], c = [toFloat(e.Latitude), toFloat(e.Longitude)];
      markers.push(L.polyline([p, c], { color: color, weight: 2.5, opacity: 0.85, dashArray: '2 7', rideDate: day, rideKey: dateKey(day) + trip.from }).addTo(map));
      addTravelIcon([(p[0] + c[0]) / 2, (p[1] + c[1]) / 2], trip.mode);
    });
  });

  // Place markers on top of lines
  days.forEach((day, dayIdx) => {
    const entries = byDay[day];
    const color = dayColors[day];

    entries.forEach((e, entryIdx) => {
      const lat = toFloat(e.Latitude);
      const lon = toFloat(e.Longitude);
      if (isNaN(lat) || isNaN(lon)) return;

      const isLatest = dayIdx === days.length - 1 && entryIdx === entries.length - 1;

      let marker;
      if (isLatest) {
        const icon = L.divIcon({
          className: '',
          html: `<div class="latest-marker"></div>`,
          iconSize: [14, 14], iconAnchor: [7, 7]
        });
        marker = L.marker([lat, lon], { icon, zIndexOffset: 1000 });
      } else {
        const icon = L.divIcon({
          className: '',
          html: `<div class="day-marker" style="background:var(--accent)">${dayNumMap ? dayNumMap[day] : dayIdx + 1}</div>`,
          iconSize: [28, 28], iconAnchor: [14, 14]
        });
        marker = L.marker([lat, lon], { icon });
      }

      const weather = e.Weather_Auto || e.Weather || '';
      const temp = e.Temp_C ? `${e.Temp_C}°C` : '';
      marker.bindPopup(`
        <div class="popup-time">${e.Date || ''} · ${e.Time || ''}</div>
        <div class="popup-title">${weather} ${temp}</div>
        ${e.Terrain ? `<div class="popup-row">Terrain: <span>${e.Terrain}</span></div>` : ''}
        ${e.Pace ? `<div class="popup-row">Pace: <span>${e.Pace}</span></div>` : ''}
        ${e.Note ? `<div class="popup-note">"${e.Note}"</div>` : ''}
      `);
      marker.on('click', () => openDetail(e));
      marker.addTo(notesLayer);   // the Notes checkbox
    });
  });

  // The view stays where initMap put it (all of Iceland), so the map doesn't jump once the entries arrive
  playReady.entries = true;
  addPlayControl();
}

// Daily biometrics box for one date (DD/MM/YYYY), '' when the Biometrics tab has no row
function dayBioHTML(day) {
  const bio = trackerBio[day];
  if (!bio) return '';
  const f = (col, digits) => { const v = d_num(bio[col]); return v == null ? null : v.toLocaleString('en-GB', { maximumFractionDigits: digits, minimumFractionDigits: digits }); };
  const cells = [
    ['📏 Distance',  f('Distance_km', 1),    'km'],
    ['👣 Steps',     f('Steps', 0),          ''],
    ['⛰️ Gain',      f('Gain_m', 0),         'm'],
    ['🔥 Calories',  f('Calories_kcal', 0),  'kcal'],
    ['❤️ Walking HR', f('Avg_Walking_HR', 0), 'BPM'],
    ['💪 Cardio load', f('Cardio_Load', 2),  ''],
    ['🌡️ Skin temp', f('Skin_Temp_C', 1),    '°C'],
    ['😴 Sleep',     f('Sleep_Score', 0),    '/100'],
  ].filter(c => c[1] != null);
  if (!cells.length) return '';
  return `<div class="day-bio">${cells.map(([label, v, unit]) =>
    `<div class="day-bio-cell"><span class="day-bio-label">${label}</span><span class="day-bio-val">${v}${unit ? ' <small>' + unit + '</small>' : ''}</span></div>`).join('')}</div>`;
}

// Fly the map to a day's entries (all of them in view, not closer than a day's walk needs)
function flyToDay(entries) {
  const pts = entries.filter(hasCoords).map(e => [toFloat(e.Latitude), toFloat(e.Longitude)]);
  if (!pts.length || !map || !map.getContainer().offsetWidth) return;   // the map is hidden on the phone's Diary page
  map.flyToBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 11, duration: 0.8 });
}

// ── LOG RENDER ─────────────────────────────────────────
function renderLog(byDay, days, dayNumMap) {
  const list = document.getElementById('log-list');
  list.innerHTML = '';

  [...days].reverse().forEach((day, di) => {
    const entries = byDay[day];
    const color = dayColors[day];
    const dayNum = dayNumMap ? dayNumMap[day] : (days.indexOf(day) + 1);
    const lastEntry = entries[entries.length - 1];
    const weatherSummary = lastEntry.Weather_Auto || lastEntry.Weather || '';

    const group = document.createElement('div');
    group.className = 'day-group';

    const heading = document.createElement('div');
    heading.className = 'day-heading';
    heading.innerHTML = `
      <div>
        <div class="day-name" style="color:${color}">Day ${dayNum}</div>
        <div class="day-date">${formatDate(day)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="day-count" style="background:${color}">${entries.length}</span>
        <div class="day-meta">
          ${weatherSummary}<br>
          ${lastEntry.Terrain || ''}
        </div>
      </div>`;

    const entriesDiv = document.createElement('div');
    entriesDiv.className = 'day-entries' + (di === 0 ? '' : ' collapsed');

    heading.onclick = () => {
      entriesDiv.classList.toggle('collapsed');
      if (!entriesDiv.classList.contains('collapsed')) flyToDay(entries);   // opening a day shows it on the map
    };
    group.appendChild(heading);

    // Phone Diary page: jump to this day on the Map page
    const mapLink = document.createElement('button');
    mapLink.className = 'day-maplink';
    mapLink.textContent = '🗺 Show on map';
    mapLink.onclick = () => { switchTab('tracker', 'map'); setTimeout(() => flyToDay(entries), 120); };
    entriesDiv.appendChild(mapLink);

    // Daily biometrics box, shown at the top of the open day
    entriesDiv.insertAdjacentHTML('beforeend', dayBioHTML(day));

    // Entries — morning to night within the day (days themselves stay newest first)
    [...entries].sort((a, b) => (a.Timestamp || '').localeCompare(b.Timestamp || '')).forEach(e => {
      const el = document.createElement('div');
      el.className = 'entry';
      el.onclick = () => openDetail(e);

      const weatherIcon = getWeatherIcon(e.Weather_Auto || e.Weather || '');
      const temp = e.Temp_C ? `${e.Temp_C}°C` : '';

      // Build field tags
      const fieldTags = buildFieldTags(e);

      const lat = e.Latitude ? toFloat(e.Latitude).toFixed(5) : null;
      const lon = e.Longitude ? toFloat(e.Longitude).toFixed(5) : null;
      const locationHTML = lat ? `<div class="entry-gps"><a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color:var(--accent);text-decoration:none">📍 View location</a></div>` : '';

      // Wind comparison
      const windCompHTML = (e.Wind_Scale && e.Wind_ms) ? `
        <div class="comparison-block" style="margin-top:8px">
          <div class="comparison-row forecasted">
            <span class="comp-label">🌬 Forecasted</span>
            <span class="comp-val">${e.Wind_ms} m/s</span>
          </div>
          <div class="comparison-row perceived">
            <span class="comp-label">🧍 Perceived</span>
            <span class="comp-val">${scaleLabel('Wind_Scale', e.Wind_Scale)}</span>
          </div>
        </div>` : '';

      // Weather/temp comparison
      const weatherCompHTML = (e.Weather && e.Weather_Auto) ? `
        <div class="comparison-block" style="margin-top:6px">
          <div class="comparison-row forecasted">
            <span class="comp-label">📡 Forecasted</span>
            <span class="comp-val">${e.Weather_Auto}${e.Feels_C ? ' · feels ' + e.Feels_C + '°C' : ''}</span>
          </div>
          <div class="comparison-row perceived">
            <span class="comp-label">🧍 Perceived</span>
            <span class="comp-val">${e.Weather}${e.Cold ? ' · Cold: ' + scaleLabel('Cold', e.Cold) : ''}</span>
          </div>
        </div>` : '';

      el.innerHTML = `
        <div class="entry-time">${e.Time || ''}</div>
        ${weatherCompHTML ? '' : `<div class="entry-weather">${weatherIcon} ${e.Weather_Auto || e.Weather || '—'} ${temp}</div>`}
        <div class="entry-fields">${fieldTags}</div>
        ${windCompHTML}
        ${weatherCompHTML}
        ${e.Note ? `<div class="entry-note">${e.Note}</div>` : ''}
        ${locationHTML}
      `;
      entriesDiv.appendChild(el);
    });

    group.appendChild(entriesDiv);
    list.appendChild(group);
  });
}

// Scale label maps — what numbers mean in human terms
const SCALE_LABELS = {
  Tiredness:     {1:'Fresh',      2:'Slightly tired', 3:'Tired',    4:'Very tired',   5:'Exhausted'},
  Sleep_Quality: {1:'Terrible',   2:'Poor',           3:'Okay',     4:'Good',         5:'Excellent'},
  Cold:          {1:'Warm',       2:'Cool',           3:'Cold',     4:'Very cold',    5:'Freezing'},
  Solitude:      {1:'Total loneliness', 2:'Getting lonely', 3:'Neutral', 4:'Embracing solitude', 5:'Total solitude'},
  Trolley:       {1:'Very light', 2:'Light',          3:'Medium',   4:'Heavy',        5:'Very heavy'},
  Wind_Scale:    {1:'Calm',       2:'Light breeze',   3:'Windy',    4:'Very windy',   5:'Storm force'},
};

// Icon per scale field
const SCALE_ICONS = {
  Tiredness:     '😴',
  Sleep_Quality: '🌙',
  Cold:          '🥶',
  Solitude:      '🚶',
  Trolley:       '🧳',
  Wind_Scale:    '💨',
};

function renderScaleIcons(field, val) {
  const n = parseInt(val);
  if (isNaN(n)) return val;
  const icon = SCALE_ICONS[field] || '●';
  const label = SCALE_LABELS[field] && SCALE_LABELS[field][n] ? SCALE_LABELS[field][n] : `${n}/5`;
  let html = `<span style="display:inline-flex;align-items:center;gap:3px">`;
  for (let i = 1; i <= 5; i++) {
    html += `<span class="scale-icon${i <= n ? ' on' : ''}">${icon}</span>`;
  }
  html += `<span style="margin-left:5px;font-size:11px;color:var(--muted)">${label}</span>`;
  html += `</span>`;
  return html;
}

function windBeaufort(ms) {
  const v = parseFloat(ms);
  if (isNaN(v)) return '';
  if (v < 0.3) return 'Calm';
  if (v < 1.6) return 'Light air';
  if (v < 3.4) return 'Light breeze';
  if (v < 5.5) return 'Gentle breeze';
  if (v < 8.0) return 'Moderate breeze';
  if (v < 10.8) return 'Fresh breeze';
  if (v < 13.9) return 'Strong breeze';
  if (v < 17.2) return 'Near gale';
  if (v < 20.8) return 'Gale';
  if (v < 24.5) return 'Severe gale';
  if (v < 28.5) return 'Storm';
  return 'Violent storm';
}

function scaleLabel(field, val) {
  const n = parseInt(val);
  if (isNaN(n)) return val;
  const map = SCALE_LABELS[field];
  if (map && map[n]) return map[n] + ` (${n}/5)`;
  return `${n}/5`;
}

// Animal name → emoji map
const ANIMAL_ICONS = {
  'dog':'🐕','cat':'🐈','horse':'🐴','cow':'🐄','bird':'🐦','fox':'🦊','deer':'🦌',
  'sheep':'🐑','pig':'🐖','rabbit':'🐇','whale':'🐳','seal':'🦭','puffin':'🐧',
  'raven':'🐦‍⬛','eagle':'🦅','reindeer':'🦌','arctic fox':'🦊','mink':'🦦',
};

function animalDisplay(val) {
  if (!val) return '';
  return val.split(';').map(a => {
    const key = a.trim().toLowerCase();
    const icon = ANIMAL_ICONS[key];
    return icon ? icon : a.trim();
  }).join(' ');
}

function buildFieldTags(e) {
  const skip = new Set(['Timestamp','Date','Time','Latitude','Longitude','GPS_Acc_m','Weather_Auto','Temp_C','Feels_C','Wind_ms','Precip_mm','Note','_synced','Weather','_dayNum']);
  let html = '';
  const fields = [
    {k:'Tiredness',    label:'Tiredness',   scale:true,  yn:false},
    {k:'Sleep_Quality',label:'Sleep',       scale:true,  yn:false},
    {k:'Cold',         label:'Cold',        scale:true,  yn:false},
    {k:'Wind_Scale',   label:'Wind',        scale:true,  yn:false},
    {k:'Solitude',     label:'Solitude',    scale:true,  yn:false},
    {k:'Trolley',      label:'Trolley',     scale:true,  yn:false},
    {k:'Hunger',       label:'Hunger',      scale:false, yn:true},
    {k:'Thirst',       label:'Thirst',      scale:false, yn:true},
    {k:'Trance',       label:'Trance',      scale:false, yn:true},
    {k:'Mental_Loop',  label:'Mental Loop', scale:false, yn:true},
    {k:'Humans',       label:'Humans',      scale:false, yn:true},
    {k:'Pace',         label:'Pace',        scale:false, yn:false},
    {k:'Skin',         label:'Skin',        scale:false, yn:false},
    {k:'Terrain',      label:'Terrain',     scale:false, yn:false},
    {k:'Pain',         label:'Pain',        scale:false, yn:false},
    {k:'Animals',      label:'Animals',     scale:false, yn:false, animal:true},
    {k:'Camping_Plot', label:'Camp',        scale:false, yn:false},
  ];

  fields.forEach(({k, label, scale, yn, animal}) => {
    const v = e[k];
    if (!v) return;

    // Skip "No" values for boolean fields
    if (yn && v.toLowerCase() === 'no') return;

    const isPain = k === 'Pain';
    const cls = isPain ? 'field-tag pain-tag' : 'field-tag has-val';

    if (scale && SCALE_ICONS[k] && !isNaN(parseInt(v))) {
      const n = parseInt(v);
      const icon = SCALE_ICONS[k];
      const humanLabel = SCALE_LABELS[k] && SCALE_LABELS[k][n] ? SCALE_LABELS[k][n] : `${n}/5`;
      let icons = '';
      for (let i = 1; i <= 5; i++) {
        icons += `<span style="opacity:${i<=n?'1':'0.15'}">${icon}</span>`;
      }
      html += `<span class="${cls}" style="display:inline-flex;align-items:center;gap:3px;padding:4px 8px" title="${label}: ${humanLabel}">${icons}<span style="margin-left:4px;font-size:9px">${label}</span></span>`;
    } else if (yn && v.toLowerCase() === 'yes') {
      // Just show label, no "Yes"
      html += `<span class="${cls}">${label}</span>`;
    } else if (animal) {
      const display = animalDisplay(v);
      html += `<span class="${cls}" title="${v}">${display}</span>`;
    } else {
      html += `<span class="${cls}">${label}: ${v}</span>`;
    }
  });

  // Custom fields
  Object.entries(e).forEach(([k,v]) => {
    if (!v || skip.has(k) || fields.find(f=>f.k===k)) return;
    if (v.toLowerCase() === 'no') return;
    const display = v.toLowerCase() === 'yes' ? k.replace(/_/g,' ') : `${k.replace(/_/g,' ')}: ${v}`;
    html += `<span class="field-tag has-val">${display}</span>`;
  });

  return html || '<span class="field-tag">no field data</span>';
}

    ['Pain',          e.Pain,          false, null],
  ].filter(([,v]) => v && v.toLowerCase() !== 'no')
   .map(([l,v,s,k]) => [l, v.toLowerCase()==='yes' ? '✓' : v, s, k]);

  const environment = [
    ['Terrain',      e.Terrain],
    ['Animals',      e.Animals ? animalDisplay(e.Animals) : null],
    ['Humans',       e.Humans && e.Humans.toLowerCase() !== 'no' ? (e.Humans.toLowerCase()==='yes'?'✓':e.Humans) : null],
    ['Camping Plot', e.Camping_Plot],
  ].filter(([,v]) => v);

  const weather = [
    ['Condition', e.Weather_Auto],
    ['Temperature', e.Temp_C ? e.Temp_C + '°C' : ''],
    ['Feels like', e.Feels_C ? e.Feels_C + '°C' : ''],
    ['Wind', e.Wind_ms ? e.Wind_ms + ' m/s' : ''],
    ['Precip', e.Precip_mm ? e.Precip_mm + ' mm' : ''],
  ].filter(([,v]) => v);

  // The day's biometrics first
  const bioBox = dayBioHTML(e.Date);
  let html = bioBox ? `<div class="detail-section"><h3>Day biometrics</h3>${bioBox}</div>` : '';

  // Wind comparison
  if (e.Wind_ms || e.Wind_Scale) {
    html += `<div class="detail-section"><h3>Wind</h3>
      <div class="detail-comparison">
        ${e.Wind_ms ? `<div class="detail-comp-row forecasted"><span class="dc-label">📡 Forecasted</span><span class="dc-val">${e.Wind_ms} m/s${e.Wind_ms ? ' — ' + windBeaufort(e.Wind_ms) : ''}</span></div>` : ''}
        ${e.Wind_Scale ? `<div class="detail-comp-row perceived"><span class="dc-label">🧍 Perceived</span><span class="dc-val">${scaleLabel('Wind_Scale', e.Wind_Scale)}</span></div>` : ''}
      </div>
    </div>`;
  }

  // Weather comparison
  if (e.Weather_Auto || e.Weather || e.Temp_C) {
    html += `<div class="detail-section"><h3>Weather</h3>
      <div class="detail-comparison">
        <div class="detail-comp-row forecasted">
          <span class="dc-label">📡 Forecasted</span>
          <span class="dc-val">${[e.Weather_Auto, e.Temp_C?e.Temp_C+'°C':'', e.Feels_C?'feels '+e.Feels_C+'°C':'', e.Precip_mm?e.Precip_mm+'mm precip':''].filter(Boolean).join(' · ')}</span>
        </div>
        ${e.Weather ? `<div class="detail-comp-row perceived"><span class="dc-label">🧍 Perceived</span><span class="dc-val">${e.Weather}${e.Cold?' · Cold: '+scaleLabel('Cold',e.Cold):''}</span></div>` : ''}
      </div>
    </div>`;
  }

  if (physical.length) {
    html += `<div class="detail-section"><h3>Physical State</h3><div class="detail-grid">`;
    physical.forEach(([l,v,isScale,key]) => html += detailRow(l,v,isScale,key));
    html += `</div></div>`;
  }

  if (environment.length) {
    html += `<div class="detail-section"><h3>Environment</h3><div class="detail-grid">`;
    environment.forEach(([l,v]) => html += detailRow(l,v,false));
    html += `</div></div>`;
  }

  // Custom fields
  const knownKeys = new Set(['Timestamp','Date','Time','Latitude','Longitude','GPS_Acc_m','Weather_Auto','Temp_C','Feels_C','Wind_ms','Precip_mm','Note','_synced','Tiredness','Sleep_Quality','Cold','Solitude','Trolley','Wind_Scale','Hunger','Thirst','Trance','Mental_Loop','Skin','Pace','Pain','Terrain','Animals','Humans','Camping_Plot','Weather','dayNum','_dayNum']);
  const custom = Object.entries(e).filter(([k,v]) => v && !knownKeys.has(k));
  if (custom.length) {
    html += `<div class="detail-section"><h3>Custom Fields</h3><div class="detail-grid">`;
    custom.forEach(([k,v]) => html += detailRow(k.replace(/_/g,' '),v,false));
    html += `</div></div>`;
  }

  if (e.Note) {
    html += `<div class="detail-section"><h3>Note</h3><div class="detail-note">${e.Note}</div></div>`;
  }

  if (e.Latitude && e.Longitude) {
    const lat = toFloat(e.Latitude).toFixed(5);
    const lon = toFloat(e.Longitude).toFixed(5);
    html += `<div class="detail-section"><h3>Location</h3>
      <div style="margin-top:10px"><a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color:var(--accent);font-size:14px;font-family:var(--font-serif)">📍 Open this location in Google Maps →</a></div>
    </div>`;
  }

  body.innerHTML = html;
  modal.classList.add('open');
  document.getElementById('detail-box').scrollTop = 0;

  // Arrows: where this entry sits in the time order
  detailIdx = detailOrder.indexOf(e);
  document.getElementById('detail-prev').disabled = detailIdx <= 0;
  document.getElementById('detail-next').disabled = detailIdx < 0 || detailIdx >= detailOrder.length - 1;

  // Pan map to this entry
  if (e.Latitude && e.Longitude) {
    map.setView([toFloat(e.Latitude), toFloat(e.Longitude)], 14);
  }
}

function detailRow(label, val, isScale, fieldKey) {
  let valHTML = val || '—';
  if (isScale && fieldKey && !isNaN(parseInt(val))) {
    valHTML = renderScaleIcons(fieldKey, val);
  }
  return `<div class="detail-row"><span class="d-label">${label}</span><span class="d-val">${valHTML}</span></div>`;
}

function closeDetail(event) {
  if (event.target === document.getElementById('detail-modal')) closeModal();
}
function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }

// Previous / next entry: arrow buttons, ← → keys, and a sideways swipe on phones.
// The window slides out on the side it leaves and the new entry slides in from the other.
const DETAIL_SLIDE_MS = 180;
let detailSliding = false;
function detailBoxMove(x, ms) {
  const box = document.getElementById('detail-box');
  box.style.transition = ms ? `transform ${ms}ms ease, opacity ${ms}ms ease` : 'none';
  box.style.transform = x ? `translateX(${x}px)` : '';
  box.style.opacity = x ? Math.max(0, 1 - Math.abs(x) / box.offsetWidth) : '';
}
function stepDetail(dir) {
  const next = detailOrder[detailIdx + dir];
  if (!next || detailSliding) return;
  detailSliding = true;
  const w = document.getElementById('detail-box').offsetWidth;
  detailBoxMove(-dir * w, DETAIL_SLIDE_MS);
  setTimeout(() => {
    openDetail(next);
    detailBoxMove(dir * w * 0.6, 0);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      detailBoxMove(0, DETAIL_SLIDE_MS);
      setTimeout(() => { detailSliding = false; }, DETAIL_SLIDE_MS);
    }));
  }, DETAIL_SLIDE_MS);
}
document.addEventListener('keydown', ev => {
  if (!document.getElementById('detail-modal').classList.contains('open')) return;
  if (ev.key === 'ArrowLeft') stepDetail(-1);
  else if (ev.key === 'ArrowRight') stepDetail(1);
});
(() => {
  // The window follows the finger sideways; let go past 60 px to change entry, otherwise it springs back
  const box = document.getElementById('detail-box');
  let x0 = null, y0 = null, dragging = false, dx = 0;
  box.addEventListener('touchstart', ev => {
    if (detailSliding) return;
    x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; dragging = false; dx = 0;
  }, { passive: true });
  box.addEventListener('touchmove', ev => {
    if (x0 == null) return;
    const mx = ev.touches[0].clientX - x0, my = ev.touches[0].clientY - y0;
    if (!dragging) {
      if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { x0 = null; return; } // vertical: let it scroll
      if (Math.abs(mx) < 10) return;
      dragging = true;
    }
    dx = mx;
    const hasNext = !!detailOrder[detailIdx + (dx < 0 ? 1 : -1)];
    detailBoxMove(hasNext ? dx : dx * 0.25, 0); // stiff at the first and last entry
  }, { passive: true });
  box.addEventListener('touchend', () => {
    if (x0 == null) return;
    x0 = null;
    if (!dragging) return;
    const dir = dx < 0 ? 1 : -1; // swipe left = next
    if (Math.abs(dx) > 60 && detailOrder[detailIdx + dir]) stepDetail(dir);
    else detailBoxMove(0, DETAIL_SLIDE_MS);
  }, { passive: true });
})();

// ── HELPERS ────────────────────────────────────────────
function getWeatherIcon(w) {
  if (!w) return '🌡️';
  const s = w.toLowerCase();
  if (s.includes('sun') || s.includes('clear')) return '☀️';
  if (s.includes('storm') || s.includes('thunder')) return '⛈️';
  if (s.includes('snow')) return '❄️';
  if (s.includes('rain') || s.includes('drizzle') || s.includes('shower')) return '🌧️';
  if (s.includes('fog') || s.includes('mist')) return '🌫️';
  if (s.includes('cloud') || s.includes('overcast')) return '☁️';
  if (s.includes('partly')) return '⛅';
  if (s.includes('wind')) return '🌬️';
  return '🌤️';
}

function formatDate(dateStr) {
  try {
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      // DD/MM/YYYY
      const d = new Date(parts[2], parts[1]-1, parts[0]);
      return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    }
    return new Date(dateStr).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  } catch(e) { return dateStr; }
}

function hideLoading(msg) {
  const screen = document.getElementById('loading-screen');
  if (msg) document.getElementById('loading-msg').textContent = msg;
  setTimeout(() => screen.classList.add('gone'), 600);
}

// Safety net — always dismiss loading screen after 12 seconds no matter what
setTimeout(() => {
  document.getElementById('loading-screen').classList.add('gone');
}, 12000);


// ── INIT ─────────────────────────────────────────────────
window.addEventListener('load', () => {
  // Start with diary view; the title screen dissolves as the radial starts composing (diaryInit)
  diaryInited = true;
  diaryInit();
});

// Safety net
setTimeout(() => {
  document.getElementById('loading-screen').classList.add('gone');
}, 8000);
</script>
